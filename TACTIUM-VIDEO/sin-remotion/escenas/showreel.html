<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TACTIUM · showreel 3D</title>
<!--
  Prueba: reel 9:16 hecho solo con HTML + CSS + JS + Three.js (sin Remotion).
  Todo es función pura del tiempo: window.seek(t) pinta el fotograma t.
  render.mjs (node sin-remotion/render.mjs escenas/showreel.html) lo recorre fotograma a fotograma y lo pasa a FFmpeg.
  Abierto sin ?render=1 se reproduce en bucle para previsualizar.
-->
<link rel="stylesheet" href="../lib/base.css">
<style>


  #hook { top: 300px; font: 900 96px/1.02 Satoshi; color: var(--hueso); letter-spacing: -2px; }
  #hook span { display: inline-block; }

  .card { position: absolute; inset: 0; display: none; overflow: hidden; }
  .card .word { position: absolute; left: 80px; width: 830px; top: 50%; text-align: center;
                font: 900 190px/1 Satoshi; letter-spacing: -6px; transform-origin: center; }
  .card .echo { position: absolute; left: 80px; width: 830px; text-align: center; font: 900 150px/1 Satoshi;
                letter-spacing: -4px; color: transparent; -webkit-text-stroke: 2px var(--fg); }

  #s3shade { background: linear-gradient(180deg, rgba(3,15,15,0.92) 0%, rgba(3,15,15,0.75) 30%, transparent 48%); opacity: 0; }
  #s3txt { top: 300px; font: 900 108px/1.04 Satoshi; color: var(--hueso); letter-spacing: -3px; }
  #s3txt div { will-change: transform, opacity; }

  #real { display: none; background: #000; }
  #clip { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; filter: contrast(1.06) saturate(0.9); }
  #realshade { background: linear-gradient(180deg, rgba(3,15,15,0.55) 0%, rgba(3,15,15,0.85) 26%, rgba(3,15,15,0.85) 60%, rgba(3,15,15,0.15) 88%); opacity: 0; }
  #dim { background: var(--bg); opacity: 0; }
  #score { top: 640px; text-align: center; color: var(--hueso); display: none; }
  #score .lbl { font: 500 30px JBM; letter-spacing: 8px; color: rgba(243,249,246,0.7); }
  #score .num { font: 700 330px/1 JBM; letter-spacing: -10px; margin: 30px 0 20px; }
  #score .sub { font: 700 58px Satoshi; letter-spacing: -1px; }

  #light { display: none; background:
      radial-gradient(ellipse 60% 40% at 30% 30%, rgba(0,223,130,0.20), transparent 70%),
      radial-gradient(ellipse 50% 45% at 75% 75%, rgba(3,98,76,0.22), transparent 70%), var(--hueso); }
  #s5 { top: 700px; color: var(--bg); }
  #s5 .a { font: italic 400 190px/1 ISerif; letter-spacing: -2px; }
  #s5 .b { font: 900 150px/1 Satoshi; letter-spacing: -5px; margin-top: 10px; }

  #brand { display: none; background: var(--bg); }
  #wm { top: 830px; text-align: center; font: 900 158px/1 Satoshi; color: var(--hueso); letter-spacing: 2px; white-space: nowrap; }
  #wm span { display: inline-block; }
  #wm .i { position: relative; width: 34px; height: 113px; margin: 0 6px; vertical-align: baseline; }
  #wm .i .stem { position: absolute; left: 0; bottom: 0; width: 34px; height: 80px; background: var(--hueso); }
  #wm .i .dot { position: absolute; left: 0; top: 0; width: 34px; height: 34px; background: var(--verde); }
  #url { top: 1040px; text-align: center; font: 500 38px JBM; color: var(--gris); letter-spacing: 6px; }


  #flash { background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <!-- Jugada real (clip 13, 60 fps) a cámara lenta 0,5x: un fotograma de origen por fotograma de salida. -->
  <div class="layer" id="real"><img id="clip" alt=""><div class="layer" id="realshade"></div></div>

  <div class="layer"><div id="hook" class="safe"></div></div>

  <div class="card" id="c0"></div>
  <div class="card" id="c1"></div>
  <div class="card" id="c2"></div>

  <div class="layer" id="s3shade"></div>
  <div class="layer"><div id="s3txt" class="safe"><div>5 parejas.</div><div>10 jugadores.</div><div>Un equipo.</div></div></div>

  <div class="layer" id="dim"></div>
  <div class="layer"><div id="score" class="safe"><div class="lbl">JORNADA 06 · RESULTADO</div><div class="num"></div><div class="sub">5 partidos. Un marcador.</div></div></div>

  <div class="layer" id="light"><div id="s5" class="safe"><div class="a">Tu equipo,</div><div class="b">en un toque.</div></div></div>

  <div class="layer" id="brand">
    <div id="wm" class="safe"><span>T</span><span>A</span><span>C</span><span>T</span><span class="i"><span class="stem"></span><span class="dot"></span></span><span>U</span><span>M</span></div>
    <div id="url" class="safe">tactium.io</div>
  </div>

  <div class="layer" id="hud">
    <div class="tl">TACTIUM — LIGA POR EQUIPOS</div><div class="tr"></div>
    <div class="bar"></div><div class="ph"></div>
    <div class="bl"></div><div class="br">150 BPM · 9:16</div>
  </div>

  <div class="layer" id="flash"></div>
</div>

<script type="module">
import { crearRenderer, arrancar } from "../lib/base.js";
import { crearPelota } from "../lib/pelota.js";
import { crearPistas } from "../lib/pistas.js";
import { clamp, prog, eOut, eInOut, eBack, lerp, decode, $ } from "../lib/util.js";

// ── Tiempos (s). La música entra recortada para que el drop caiga en 2.4 y
//    los golpes fuertes cada 1.6 s / 0.8 s (≈150 BPM).
const FPS = 30, DUR = 14;
const T = { drop: 2.4, s3: 4.8, s4: 8.8, s5: 10.4, s6: 12.0 };

// ── DOM: gancho palabra a palabra
const HOOK = ["¿Y", "si", "tu", "equipo", "se", "organizara", "solo?"];
$("#hook").innerHTML = HOOK.map((w) => `<span>${w}</span>`).join(" ");
const hookSpans = [...document.querySelectorAll("#hook span")];

// ── DOM: tarjetas de palabra a golpe de bombo (un solo acento por plano)
const CARDS = [
  { w: "CONVOCA", bg: "#00DF82", fg: "#030F0F", t0: 2.4, t1: 3.2 },
  { w: "ALINEA",  bg: "#030F0F", fg: "#F3F9F6", t0: 3.2, t1: 4.0 },
  { w: "JUEGA",   bg: "#03624C", fg: "#F3F9F6", t0: 4.0, t1: 5.1 },
];
const ECHO_Y = [330, 560, 1240, 1470];
CARDS.forEach((c, i) => {
  const el = $("#c" + i); el.style.background = c.bg; el.style.color = c.fg; el.style.setProperty("--fg", c.fg);
  el.innerHTML = ECHO_Y.map((y) => `<div class="echo" style="top:${y}px">${c.w}</div>`).join("") + `<div class="word">${c.w}</div>`;
});

// ── 3D
const canvas = $("#gl");
const { renderer, scene, cam } = crearRenderer(canvas);
const pelota = crearPelota(); scene.add(pelota.group);
const pistas = crearPistas(); scene.add(pistas.group);
const CLIP_FRAMES = 66;
const clipImg = $("#clip");
const clipSrc = (i) => `../clips/j13/${String(i).padStart(3, "0")}.jpg`;

// ── seek(t): el único sitio donde el tiempo se convierte en imagen
async function seek(t) {
  const frame = Math.round(t * FPS);

  // S1: gancho + pelota
  const s1 = t < T.drop;
  pelota.group.visible = s1;
  hookSpans.forEach((s, i) => {
    const p = eOut(prog(t, 0.1 + i * 0.2, 0.25));
    s.style.opacity = p; s.style.transform = `translateY(${(1 - p) * 40}px)`;
  });
  $("#hook").style.display = s1 ? "block" : "none";
  if (s1) {
    const rush = eInOut(prog(t, 1.9, 0.5));
    cam.position.set(0, 0, 6); cam.up.set(0, 1, 0); cam.lookAt(0, 0.6, 0); cam.fov = 50;
    pelota.ball.position.set(0, lerp(0.05 + Math.sin(t * 2.2) * 0.08, 0.5, rush), lerp(0, 5.4, rush));
    pelota.ball.rotation.set(t * 0.9, t * 1.6, 0.3);
    pelota.ball.scale.setScalar(eBack(prog(t, 0, 0.6)) * 1.0 || 0.0001);
    pelota.dust.rotation.y = t * 0.05; pelota.dust.position.y = t * 0.25;
  }

  // S2: tarjetas a golpe
  CARDS.forEach((c, i) => {
    const el = $("#c" + i); const on = t >= c.t0 && t < c.t1; el.style.display = on ? "block" : "none";
    if (!on) return;
    const p = eOut(prog(t, c.t0, 0.16));
    el.querySelector(".word").style.transform = `translateY(-50%) scale(${1.45 - 0.45 * p})`;
    el.querySelectorAll(".echo").forEach((e, k) => { e.style.opacity = 0.35 * eOut(prog(t, c.t0 + 0.08 + k * 0.05, 0.2)); });
    // Salida de JUEGA: se abre en dos (puertas) para destapar las pistas.
    if (i === 2) { const q = eInOut(prog(t, T.s3, 0.3)) * 50; el.style.clipPath = `inset(0 0 ${q}% 0)`; el.style.transform = `translateY(${-q * 4}px)`; }
  });

  // S3: pistas. Subida a vista cenital (4.8-7.6) y picado al fondo de la pista cercana (7.6-8.75).
  const s3 = t >= T.s3 - 0.0001 && t < 8.95;
  pistas.group.visible = s3;
  if (s3) {
    if (t < 7.6) pistas.camara(cam, pistas.rutas.subida, eInOut(prog(t, T.s3, 7.6 - T.s3)));
    else pistas.camara(cam, pistas.rutas.picado, eInOut(prog(t, 7.6, 1.15)));
    cam.fov = 50;
    // Los haces se recogen en el picado para no cruzarse delante de la cámara.
    pistas.animarJugadores(t, { aparecen: 5.6, alzan: 6.4, recoger: 7.9, red: 7.2 });
  }
  const textOut = 1 - eOut(prog(t, 8.0, 0.25));
  $("#s3shade").style.opacity = t >= 5.4 ? eOut(prog(t, 5.4, 0.3)) * textOut : 0;
  [...$("#s3txt").children].forEach((d, i) => {
    const a = 5.6 + i * 0.8; const p = eOut(prog(t, a, 0.22));
    d.style.opacity = p * textOut; d.style.transform = `translateX(${(1 - p) * -60}px)`;
  });

  // S4: la jugada real entra fundida al terminar el picado, a 0,5x, y encima el marcador.
  const realOn = t >= 8.55 && t < T.s5;
  $("#real").style.display = realOn ? "block" : "none";
  if (realOn) {
    const r = eOut(prog(t, 8.55, 0.3));
    $("#real").style.opacity = r; $("#clip").style.transform = `scale(${1.12 - 0.12 * r})`;
    $("#realshade").style.opacity = eOut(prog(t, 9.2, 0.3));
    const i = clamp(Math.round((t - 8.55) * FPS) + 1, 1, CLIP_FRAMES);
    if (clipImg.dataset.i !== String(i)) { clipImg.src = clipSrc(i); clipImg.dataset.i = String(i); await clipImg.decode().catch(() => {}); }
  }
  canvas.style.filter = "none";
  const s4 = t >= 9.3 && t < T.s5;
  $("#score").style.display = s4 ? "block" : "none";
  if (s4) {
    $("#score .num").textContent = decode("3–2", prog(t, 9.4, 0.6), frame);
    const sp = eOut(prog(t, 9.3, 0.25)); $("#score").style.transform = `scale(${1.15 - 0.15 * sp})`; $("#score").style.opacity = sp;
    $("#score .sub").style.opacity = eOut(prog(t, 9.8, 0.25));
  }

  // S5: tarjeta clara que sube desde abajo
  const s5 = t >= T.s5 && t < T.s6;
  $("#light").style.display = s5 ? "block" : "none";
  if (s5) {
    $("#light").style.transform = `translateY(${(1 - eOut(prog(t, T.s5, 0.3))) * 100}%)`;
    const a = eOut(prog(t, 10.6, 0.3)), bb = eOut(prog(t, 11.2, 0.25));
    $("#s5 .a").style.opacity = a; $("#s5 .a").style.transform = `translateY(${(1 - a) * 30}px)`;
    $("#s5 .b").style.opacity = bb; $("#s5 .b").style.transform = `scale(${1.25 - 0.25 * bb})`;
  }

  // S6: wordmark
  const s6 = t >= T.s6;
  $("#brand").style.display = s6 ? "block" : "none";
  if (s6) {
    [...$("#wm").children].forEach((l, i) => {
      const p = eOut(prog(t, T.s6 + i * 0.05, 0.35)); l.style.opacity = p; l.style.transform = `translateY(${(1 - p) * 60}px)`;
    });
    const d = eBack(prog(t, 12.8, 0.3)); $("#wm .dot").style.transform = `translateY(${(1 - d) * -120}px)`; $("#wm .dot").style.opacity = d > 0 ? 1 : 0;
    $("#url").style.opacity = eOut(prog(t, 13.0, 0.3));
  }

  // HUD
  const scene_ = t < T.drop ? 1 : t < T.s3 ? 2 : t < 8.55 ? 3 : t < T.s5 ? 4 : t < T.s6 ? 5 : 6;
  const lightCard = (t >= T.s5 && t < T.s6) || (t >= 2.4 && t < 3.2);
  $("#hud").style.color = lightCard ? "rgba(3,15,15,0.55)" : "";
  $("#hud").style.opacity = t >= 13.0 ? 1 - prog(t, 13.0, 0.4) : 1;
  $("#hud .tr").textContent = `0${scene_} / 06`;
  const ff = frame % FPS, ss = Math.floor(frame / FPS);
  $("#hud .bl").textContent = `00:00:${String(ss).padStart(2, "0")}:${String(ff).padStart(2, "0")}`;
  $("#hud .ph").style.left = `${80 + 830 * (t / DUR)}px`;

  // Destello en el drop
  $("#flash").style.opacity = t >= T.drop ? Math.max(0, 1 - (t - T.drop) / 0.22) : Math.max(0, (t - 2.25) / 0.15);
  // Pequeño destello al casar el picado con la grabación real.
  if (t >= 8.6 && t < 8.95) $("#flash").style.opacity = 0.55 * (1 - Math.abs(t - 8.72) / 0.2);

  cam.updateProjectionMatrix();
  renderer.render(scene, cam);
}
arrancar({
  dur: DUR, fps: FPS,
  musica: { src: "public/musica/pixabay-creative-technology-showreel.mp3", desde: 10.48 }, // drop 12.88 → t 2.4
  salida: "renders/sin-remotion/tactium-showreel-3d.mp4",
}, seek);
</script>
</body>
</html>
