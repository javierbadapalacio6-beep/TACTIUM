<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>TACTIUM · App UI kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(800px 600px at 20% 0%, rgba(0,223,130,0.08), transparent 60%),
      radial-gradient(900px 700px at 90% 90%, rgba(0,223,130,0.06), transparent 60%),
      var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
    padding: 40px 24px 80px;
    display: flex; flex-direction: column; gap: 32px; align-items: center;
  }
  .head { width: 100%; max-width: 1080px; }
  .lab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--color-accent); }
  .h1  { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; margin: 10px 0 8px; }
  .sub { color: var(--color-text-muted); font-size: 16px; max-width: 720px; line-height: 1.55; }
  .nav { display: inline-flex; gap: 6px; padding: 6px; background: var(--color-bg-card);
         border-radius: 999px; box-shadow: inset 0 0 0 1px var(--color-hair-strong); margin-top: 24px; flex-wrap: wrap; }
  .nav button { background: transparent; border: 0; padding: 10px 14px; border-radius: 999px;
                color: var(--color-text-muted); font-family: var(--font-mono); font-size: 11px;
                letter-spacing: 0.20em; text-transform: uppercase; cursor: pointer; font-weight: 600; }
  .nav button.on { background: var(--color-accent-10); color: var(--color-accent);
                   box-shadow: inset 0 0 0 1px var(--color-accent-40); }
  .stage { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; padding-top: 16px; }
  .device-wrap { transition: transform 380ms cubic-bezier(0.25,1,0.5,1); }
  .device-wrap:hover { transform: translateY(-4px); }
  /* deviceframe override: dark, accent shadow */
  .glow-frame > div {
    box-shadow:
      0 60px 120px -20px rgba(0,0,0,0.8),
      0 0 100px -20px rgba(0,223,130,0.20),
      0 0 0 1px rgba(255,255,255,0.06) !important;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const FLOW = [
      { id: "onboarding", label: "Bienvenida" },
      { id: "home",       label: "Home" },
      { id: "jornada",    label: "Jornada" },
      { id: "alineacion", label: "Alineación" },
      { id: "jornada-validated", label: "Resultado" },
      { id: "club",       label: "Club" },
    ];

    function App() {
      const [route, setRoute] = useState("home");
      const go = (id) => setRoute(id);

      const renderScreen = () => {
        switch(route) {
          case "onboarding": return <OnboardingScreen go={go}/>;
          case "home":       return <HomeScreen go={go} onTab={() => {}}/>;
          case "jornada":    return <JornadaScreen go={go} state="pending"/>;
          case "alineacion": return <AlineacionScreen go={go}/>;
          case "jornada-validated": return <JornadaScreen go={go} state="validated"/>;
          case "club":       return <ClubScreen go={go} onTab={() => {}}/>;
          default: return null;
        }
      };

      return (
        <>
          <div className="head">
            <div className="lab">UI KIT · APP IOS · 2026</div>
            <h1 className="h1">TACTIUM · App</h1>
            <p className="sub">Recreación interactiva del cliente móvil. El flujo principal: bienvenida → home del capitán → jornada → construir alineación con auto-orden FEP → confirmar y ver resultados.</p>
            <div className="nav">
              {FLOW.map(f => (
                <button key={f.id} className={route === f.id ? "on" : ""}
                  onClick={() => setRoute(f.id)}>{f.label}</button>
              ))}
            </div>
          </div>

          <div className="stage">
            <div className="device-wrap glow-frame">
              <IOSDevice dark width={390} height={844}>
                {renderScreen()}
              </IOSDevice>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
