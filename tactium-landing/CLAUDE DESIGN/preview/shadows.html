<!doctype html><html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:center;}
.box{background:var(--color-bg-card);border-radius:16px;height:110px;display:flex;align-items:flex-end;padding:14px;}
.name{font-family:var(--font-sans);font-weight:600;font-size:13px;color:var(--color-text);}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);margin-top:6px;}
.cta{background:var(--color-accent);color:var(--color-text-inverse);}
</style></head><body>
  <div>
    <div class="box" style="box-shadow:0 20px 50px -15px rgba(0,0,0,0.60),inset 0 0 0 1px rgba(255,255,255,0.04);"><div class="name">Card · soft</div></div>
    <div class="lbl">20 · 50 · −15 · 0.6</div>
  </div>
  <div>
    <div class="box" style="box-shadow:0 50px 100px -20px rgba(0,0,0,0.80),inset 0 0 0 1px rgba(255,255,255,0.04);"><div class="name">Card · strong</div></div>
    <div class="lbl">50 · 100 · −20 · 0.8</div>
  </div>
  <div>
    <div class="box cta" style="box-shadow:0 14px 40px -8px rgba(0,223,130,0.55);"><div class="name" style="color:var(--color-text-inverse)">CTA · glow</div></div>
    <div class="lbl">14 · 40 · −8 · accent 55</div>
  </div>
</body></html>
