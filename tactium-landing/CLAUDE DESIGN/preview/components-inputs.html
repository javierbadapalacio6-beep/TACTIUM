<!doctype html><html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:flex;flex-direction:column;gap:14px;}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
.field{display:flex;align-items:center;gap:10px;background:var(--color-bg-card);height:54px;border-radius:14px;padding:0 16px;box-shadow:inset 0 0 0 1px var(--color-hair-strong);font-family:var(--font-sans);}
.field.focus{box-shadow:inset 0 0 0 1.5px var(--color-accent-55), 0 0 0 4px var(--color-accent-10);}
.field input{background:transparent;border:0;outline:0;color:var(--color-text);font-family:inherit;font-size:15px;flex:1;}
.field input::placeholder{color:var(--color-text-faint);}
.icon{width:18px;height:18px;stroke:var(--color-text-faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.email-row{display:flex;gap:8px;}
.email-row .field{flex:1;}
.go{background:var(--color-accent);color:var(--color-text-inverse);border:0;border-radius:14px;padding:0 22px;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit;}
</style></head><body>
  <div class="lbl">Default · focus · waitlist</div>
  <div class="field"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input placeholder="email@dominio.com"></div>
  <div class="field focus"><svg class="icon" viewBox="0 0 24 24" style="stroke:var(--color-accent)"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input value="capitan@club.es"></div>
  <div class="email-row">
    <div class="field"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input placeholder="email@dominio.com"></div>
    <button class="go">Entrar →</button>
  </div>
</body></html>
