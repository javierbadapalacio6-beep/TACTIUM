<!doctype html><html><head><meta charset="utf-8"><title>Type · Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:var(--color-bg);}
.eye{font-family:var(--font-mono);font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:var(--color-accent);margin-bottom:14px;}
.h{font-family:var(--font-sans);font-weight:800;font-size:64px;line-height:1.02;letter-spacing:-0.02em;color:var(--color-text);}
.h .a{color:var(--color-accent);}
.meta{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);margin-top:16px;}
</style></head><body>
  <div class="eye">PRE-LANZAMIENTO · 2026</div>
  <div class="h">El sistema operativo<br>del pádel <span class="a">federado.</span></div>
  <div class="meta">Inter · 800 · 64 / 1.02 · tracking -0.02em</div>
</body></html>
