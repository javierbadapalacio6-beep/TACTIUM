<!doctype html><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end;}
.box{background:var(--color-bg-card);height:88px;box-shadow:var(--shadow-inset-line);}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);margin-top:8px;}
.v{font-family:var(--font-mono);font-size:11px;color:var(--color-accent);}
.col{display:flex;flex-direction:column;}
</style></head><body>
  <div class="col"><div class="box" style="border-radius:8px"></div><div class="v">8</div><div class="lbl">sm · chips</div></div>
  <div class="col"><div class="box" style="border-radius:12px"></div><div class="v">12</div><div class="lbl">md · pills</div></div>
  <div class="col"><div class="box" style="border-radius:16px"></div><div class="v">16</div><div class="lbl">lg · cards</div></div>
  <div class="col"><div class="box" style="border-radius:24px"></div><div class="v">24</div><div class="lbl">xl · panels</div></div>
  <div class="col"><div class="box" style="border-radius:999px"></div><div class="v">∞</div><div class="lbl">pill · CTA</div></div>
  <div class="col"><div class="box" style="border-radius:42px"></div><div class="v">42</div><div class="lbl">phone</div></div>
</body></html>
