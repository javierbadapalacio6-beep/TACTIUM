<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TACTIUM · Bitácora</title>
<style>
  :root {
    --bg: #030F0F;
    --bg-2: #061818;
    --card: #0C2222;
    --card-raised: #0F2A28;
    --hair: rgba(232, 245, 239, 0.08);
    --hair-strong: rgba(232, 245, 239, 0.14);
    --text: #E8F5EF;
    --muted: rgba(232, 245, 239, 0.70);
    --faint: rgba(232, 245, 239, 0.45);
    --accent: #00DF82;
    --accent-deep: #03624C;

    --feat: #00DF82;
    --fix: #FFB454;
    --chore: #94A3B8;
    --docs: #60A5FA;
    --decision: #C084FC;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
    line-height: 1.55;
    background-image: radial-gradient(ellipse 900px 500px at 50% -200px, rgba(3, 98, 76, 0.35) 0%, var(--bg) 60%);
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 24px 96px; }

  /* ── Header ─────────────────────────────────────────────────── */
  .header { margin-bottom: 40px; }
  .eyebrow {
    font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    margin: 0 0 14px;
  }
  h1 {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.05;
    margin: 0 0 14px;
  }
  .lede { color: var(--muted); font-size: 17px; max-width: 580px; margin: 0; }

  /* ── Stats grid ─────────────────────────────────────────────── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 36px 0 32px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--hair);
    border-radius: 16px;
    padding: 18px 18px;
  }
  .stat .num {
    font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0 0 6px;
  }
  .stat .lbl {
    font-size: 12px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 0;
  }
  .stat.accent .num { color: var(--accent); }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }

  /* ── Filtros ────────────────────────────────────────────────── */
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 24px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--hair);
    border-radius: 16px;
  }
  .chip {
    font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--hair-strong);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
  }
  .chip:hover { color: var(--text); border-color: var(--text); }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip[data-type="feat"].active { background: var(--feat); color: #001810; border-color: var(--feat); }
  .chip[data-type="fix"].active { background: var(--fix); color: #1a0a00; border-color: var(--fix); }
  .chip[data-type="chore"].active { background: var(--chore); color: #050a14; border-color: var(--chore); }
  .chip[data-type="docs"].active { background: var(--docs); color: #00121f; border-color: var(--docs); }
  .chip[data-type="decision"].active { background: var(--decision); color: #1a0033; border-color: var(--decision); }

  /* ── Entries ────────────────────────────────────────────────── */
  .entry {
    background: var(--card);
    border: 1px solid var(--hair);
    border-radius: 20px;
    padding: 28px 28px 24px;
    margin-bottom: 16px;
    position: relative;
  }
  .entry-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .entry-date {
    font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--faint);
    text-transform: uppercase;
    margin: 0;
  }
  .entry-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    line-height: 1.25;
    color: var(--text);
    margin: 0;
    flex: 1 1 100%;
  }

  .changes { list-style: none; padding: 0; margin: 0; }
  .change {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px dashed var(--hair);
  }
  .change:first-child { border-top: none; padding-top: 0; }
  .badge {
    flex: 0 0 auto;
    font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 6px;
    margin-top: 2px;
    min-width: 60px;
    text-align: center;
  }
  .badge.feat { background: rgba(0, 223, 130, 0.14); color: var(--feat); border: 1px solid rgba(0, 223, 130, 0.3); }
  .badge.fix { background: rgba(255, 180, 84, 0.14); color: var(--fix); border: 1px solid rgba(255, 180, 84, 0.3); }
  .badge.chore { background: rgba(148, 163, 184, 0.14); color: var(--chore); border: 1px solid rgba(148, 163, 184, 0.3); }
  .badge.docs { background: rgba(96, 165, 250, 0.14); color: var(--docs); border: 1px solid rgba(96, 165, 250, 0.3); }
  .badge.decision { background: rgba(192, 132, 252, 0.14); color: var(--decision); border: 1px solid rgba(192, 132, 252, 0.3); }
  .change-text { flex: 1; font-size: 15px; color: var(--muted); }
  .change-text strong { color: var(--text); font-weight: 600; }
  .change-text code {
    font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 0.88em;
    background: var(--bg-2);
    border: 1px solid var(--hair);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--text);
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--faint);
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <p class="eyebrow">TACTIUM · BITÁCORA INTERNA</p>
      <h1>Lo que cambiamos<br>cada día.</h1>
      <p class="lede">Registro cronológico de decisiones, fixes y features del proyecto. Las entradas se añaden al cierre de cada sesión de trabajo.</p>
    </header>

    <section class="stats">
      <div class="stat"><p class="num" id="stat-sessions">17</p><p class="lbl">Sesiones</p></div>
      <div class="stat accent"><p class="num" id="stat-changes">223</p><p class="lbl">Cambios</p></div>
      <div class="stat"><p class="num" id="stat-last">04 jun</p><p class="lbl">Última sesión</p></div>
      <div class="stat"><p class="num" id="stat-streak">11</p><p class="lbl">Días activos</p></div>
    </section>

    <div class="filters" id="filters">
      <button class="chip active" data-type="all">Todos</button>
      <button class="chip" data-type="feat">Feat</button>
      <button class="chip" data-type="fix">Fix</button>
      <button class="chip" data-type="chore">Chore</button>
      <button class="chip" data-type="docs">Docs</button>
      <button class="chip" data-type="decision">Decisión</button>
    </div>

    <main id="timeline"></main>
  </div>

<script>
/* ─────────────────────────────────────────────────────────────────
   LOG · Editar SOLO este array para añadir/quitar entradas.
   Formato:
   {
     date: "YYYY-MM-DD",
     title: "Resumen corto del día",
     changes: [
       { type: "feat" | "fix" | "chore" | "docs" | "decision",
         text: "Descripción. Puedes usar <strong> y <code>." }
     ]
   }
   Más reciente arriba del array (se ordena por fecha automáticamente).
   ───────────────────────────────────────────────────────────────── */
const LOG = [
  {
    date: "2026-07-21",
    title: "✏️ Editar categoría y grupo del equipo desde la app (por si te confundiste al crear o aún no está sorteada la liga) — publicado por OTA. + Refuerzo de la demo de Smash Pádel Club para la reunión (equipos con banquillo para el 5-parejas).",
    changes: [
      { type: "feat", text: "<strong>✏️ Editar categoría y grupo del equipo</strong>. En la pestaña <strong>Equipo</strong>, la cabecera (<code>nombre · categoría · Grupo X</code>) es ahora tocable (con lápiz) y abre una hoja <code>EditTeamSheet</code>: selector de <strong>categoría</strong> (1ª–10ª) y <strong>grupo</strong> (toggle «Sin grupos / Sí» + A/B/C/D). Resuelve dos casos: <strong>corregir</strong> datos mal puestos al crear el equipo y <strong>completar el grupo</strong> cuando se sortee la liga (muchos equipos se descargan la app antes del sorteo). Nueva acción de store <code>updateTeamSettings</code> → <code>updateTeam</code> (la RLS <code>teams_admin_update</code> ya deja al capitán/owner); refresca <code>team</code>+<code>teams</code> sin recargar. La cabecera muestra ahora también el grupo. Publicado por <strong>OTA a production</strong> (runtime 1.2.0, update group <code>ae892277</code>) y en <code>main</code>." },

      { type: "chore", text: "<strong>🎾 Refuerzo de la demo para Smash Pádel Club (reunión Cantabria)</strong>. La liga del club es de <strong>5 parejas por partido</strong> → la alineación son 10 titulares. Subidos los roster para que haya banquillo real y el generador de alineación luzca: <strong>Smash Masculino A 10 → 14</strong> y <strong>Smash Masculino B 6 → 12</strong> (liga de 5 parejas). <strong>Pádel Puertochico</strong> (capitán independiente) <strong>8 → 12</strong>, pero se deja como <strong>liga local de 3 parejas a propósito</strong> (variedad frente al club) — no se convierte a 5 para no dejar sus actas ya jugadas a medias. Todos disponibles; nombres españoles, puntos en escalera y mezcla Drive/Revés/Ambos." },

      { type: "fix", text: "<strong>🐛 Federación del club demo (bug de datos, no de código)</strong>. El club «Smash Pádel Club» y sus 4 equipos se habían creado por SQL con <code>federation=null</code>, lo que provocaba tres síntomas a la vez: al añadir un equipo <strong>no heredaba</strong> la federación, la pestaña Club la mostraba <strong>vacía</strong>, y las alineaciones de Masculino A/B salían a <strong>3 parejas</strong> en vez de 5 (el nº de parejas se deriva de la federación del equipo → con <code>null</code> cae al default 3). Fijado <code>federation='FCantP'</code> (Federación Cántabra: <strong>5 pistas masc / 4 fem</strong>) en el club y los 4 equipos. Las actas de Masc A ya estaban montadas a 5 pistas → todo coherente. La herencia (<code>CreateTeamFromClubScreen</code>) y el cálculo de pistas eran correctos: solo faltaba el dato. Sin OTA (solo BD); requiere reabrir la app para refrescar la caché del cliente." },
    ],
  },
  {
    date: "2026-07-19",
    title: "🎨 Perfil rediseñado estilo Instagram (escaparate + Ajustes detrás de menú) con feed de novedades, perfil público ampliado y bio/galería — y MODO CLARO: sistema de tema dinámico en toda la app. Publicado por OTA a production (runtime 1.2.0) el 2026-07-20 y mergeado a main.",
    changes: [
      { type: "feat", text: "<strong>📸 Perfil rediseñado estilo Instagram</strong>. El Perfil pasa a ser un <strong>escaparate</strong> (foto, nombre de usuario, bio, seguidores/siguiendo, equipos y galería de fotos de amistosos) y los <strong>Ajustes</strong> se esconden detrás del menú (⋯) para no ensuciar la vista pública. En la cabecera, la <strong>lupa (buscar comunidad)</strong> va junto a la campana; retirado el chip «Novedades»." },

      { type: "feat", text: "<strong>🗞️ Feed de novedades + perfil público con equipos</strong>. Nuevo feed de actividad de la gente/clubes que sigues, <strong>perfil público</strong> que muestra los equipos del jugador, <strong>notificación de nuevo seguidor</strong> y <strong>username único</strong> como identidad social. Backend social aditivo (sigue dormido en prod hasta el lanzamiento)." },

      { type: "feat", text: "<strong>✍️ Descripción/bio del perfil + galería de amistosos</strong>. El perfil admite una <strong>bio</strong> editable y una <strong>galería de fotos</strong> de los amistosos en el perfil público, reforzando el ángulo social «escaparate del jugador»." },

      { type: "feat", text: "<strong>🌗 MODO CLARO — sistema de tema dinámico en toda la app</strong>. Arquitectura nueva en <code>src/core/theme/</code>: <code>colors.ts</code> exporta <code>darkColors</code> + <code>lightColors</code> (mismas claves) y el tipo <code>Palette</code>; hooks <code>useColors()</code> / <code>useIsDark()</code> / <code>useTypography()</code>; store <code>themeStore.ts</code> con el modo persistido (Claro / Oscuro / Automático). Patrón <code>const c = useColors(); const styles = useMemo(() => makeStyles(c), [c])</code> aplicado a <strong>~77 ficheros</strong> (toda <code>src/</code> + <code>App.tsx</code> con navTheme y StatusBar reactivos). Acento en claro <code>#00995E</code> (el neón <code>#00DF82</code> no contrasta sobre blanco). Selector en <strong>Ajustes → APARIENCIA</strong>. Default sigue OSCURO. <code>tsc --noEmit</code> limpio." },

      { type: "decision", text: "<strong>Qué queda OSCURO a propósito</strong>: el splash de marca (<code>AnimatedSplash</code>) y las tarjetas que se exportan al compartir (<code>PhotoShareCard</code>, <code>LineupShareCard</code>) — son imágenes de marca, no interfaz. Pendientes de decisión fina: la píldora flotante de la tab bar y el picker nativo de fecha/hora." },

      { type: "fix", text: "<strong>🐛 Pulidos de modo claro + bugs de nombre corto (misma tanda, previo al OTA)</strong>. Helper <code>withAlpha()</code> (hex y rgba) → el chip «Pendiente» de la jornada salía oscuro en claro porque <code>textMuted/textFaint</code> son <code>rgba()</code> y el sufijo alfa hex los rompía. Jornada: hora resaltada, píldora <strong>LOCAL/VISITANTE con icono</strong> (casita/avión <code>IconPlane</code>) y tratamiento de estado. Alineación: cada pareja muestra su número (<strong>Pareja Nº2, Nº3…</strong>), la 1 marca «· TITULAR». Perfil: galería <strong>clicable → detalle del partido</strong> con badge GANADO/PERDIDO. Ajustes: versión leída de <code>expoConfig</code> (1.2.0). Amistoso/entreno: usa el <strong>username (nombre corto)</strong> propio y del compañero vinculado (<code>fetchPlayers</code> trae <code>profile_username</code>); <strong>entreno solo plantilla</strong>, colegas cualquiera." },

      { type: "chore", text: "<strong>📡 OTA a production (runtime 1.2.0) + merge a main — 2026-07-20</strong>. <code>eas update --branch production</code> (update group <code>3eb9570e</code>, iOS+Android) con TODA la rama: modo claro + rediseño social + estos fixes. Sin dependencias nativas nuevas (JS puro sobre <code>react-native-svg</code>/<code>expo-constants</code>/<code>expo-blur</code> ya presentes en el build 1.2.0). <code>feature/perfiles-sociales</code> mergeada a <code>main</code> (fast-forward) para que el histórico refleje producción." },
    ],
  },
  {
    date: "2026-07-17",
    title: "🚀 1.2.0 APROBADA en las stores + jornada intensa: nombre de usuario, código del partido, campanita de notificaciones in-app, fix de roles al canjear código, cuentas demo + presentación para Smash Pádel Club, y arranque de la capa social (en rama). Casi todo publicado por OTA a production (runtime 1.2.0).",
    changes: [
      { type: "decision", text: "<strong>✅ 1.2.0 (build 18) APROBADA en App Store y Google Play</strong>. A partir de ahora el <strong>runtime OTA de production es 1.2.0</strong>: los <code>eas update --branch production</code> llegan a usuarios reales sin esperar a ninguna store. Toda la tanda de hoy va por OTA salvo lo indicado." },

      { type: "feat", text: "<strong>🔔 Campanita de notificaciones IN-APP (v1)</strong>. Centro de notificaciones dentro de la app (campana + badge de no leídos) en las cabeceras de <strong>Home, Club y Perfil</strong>, distinto de las push. Backend aditivo: tabla <code>notifications</code> con RLS (cada uno ve/marca las suyas), triggers que avisan a capitán/club cuando <strong>alguien se une por código</strong> (<code>member_joined</code>) y cuando <strong>se vincula a una ficha</strong> (<code>player_claimed</code> «X se ha vinculado a la ficha de Y»), y <strong>espejo de las push</strong> (nueva jornada / alineación / recordatorios quedan también in-app, sin romper el push). Realtime para que el badge suba en vivo. OTA <code>093f295b</code>." },

      { type: "fix", text: "<strong>🐛 Roles: canjear un código degradaba al capitán</strong>. <code>redeem_team_invitation</code> hacía <code>ON CONFLICT DO UPDATE SET role=excluded.role</code> → si el DUEÑO canjeaba un código de JUGADOR de su propio equipo se auto-degradaba a <code>player</code> y perdía la gestión. Arreglado (conserva el rol superior; restaurados los dueños degradados). Además: un <strong>capitán que además juega</strong> (con ficha vinculada) ya puede <strong>alternar Capitán/Jugador</strong> en Perfil → Modo (el teamStore rastrea <code>myPlayerTeamIds</code>). Migración <code>20260717_redeem_no_downgrade</code> + OTA <code>bd13ad5c</code>." },

      { type: "feat", text: "<strong>👤 Nombre de usuario (nombre corto) en Perfil</strong>. El nombre + apellidos salía demasiado largo en amistosos y en la foto. Nuevo campo <code>profiles.username</code> (+ espejo en <code>user_metadata</code>, helper <code>displayNameOf</code>) editable en Perfil y usado en el pre-relleno de amistosos y el saludo del jugador suelto. Si se deja vacío, cae al nombre completo. OTA <code>6b0b046d</code>." },

      { type: "fix", text: "<strong>🐛 Jornada pasada sin acta aparecía como «PRÓXIMA»</strong>. Cuando no hay jornadas futuras sin cerrar, la Home cae (a propósito) a la pasada más reciente; pero la etiquetaba como «PRÓXIMA» con el <code>status</code> crudo. Ahora usa <code>matchdayState()</code>: una jornada jugada sin registrar sale como <strong>«PENDIENTE»</strong> (empuja a meter el resultado), en Home y en el preview de club. OTA <code>20d953a0</code>." },

      { type: "decision", text: "<strong>🤝 Capa social v1 «seguir» — construida en RAMA aparte (no en producción)</strong>. Rama <code>feature/perfiles-sociales</code>: buscar jugadores y clubes, <strong>perfil público</strong> (con snapshot de amistosos / datos del club) y <strong>seguir/dejar de seguir</strong> (una dirección, estilo Strava). Backend aditivo y dormido en prod (tabla <code>follows</code> polimórfica + RPCs <code>SECURITY DEFINER</code> que exponen solo campos seguros, nunca el email). Entrada «Comunidad» en Perfil. Sin merge ni OTA hasta validarlo; el <em>handle</em> único de username se deja para el lanzamiento." },

      { type: "docs", text: "<strong>🎾 Preparación de la demo para Smash Pádel Club (Cantabria)</strong>. 5 cuentas demo (club / capitán independiente / jugador con equipo / jugador suelto / capitán-por-código <code>SMASH25</code>) con datos ricos e interconectados y premium activo, creadas por SQL. Guía HTML imprimible con las credenciales + guion, y una <strong>presentación explicativa</strong> (Claude Design / Artifact) con capturas reales de la app, precios de los planes y el logo de TACTIUM." },

  },
  {
    date: "2026-07-16",
    title: "🐛 Fix de la tarjeta compartible del amistoso (la foto salía sin el marcador la primera vez) + botón de WhatsApp fuera. Publicado por OTA a production (runtime 1.2.0).",
    changes: [
      { type: "fix", text: "<strong>La foto del amistoso salía distinta la primera vez que se compartía</strong>. En <code>AmistosoScreen</code> la tarjeta (<code>PhotoShareCard</code>) se renderizaba SIN los props de marcador a dos líneas → salía solo el título de una línea. La versión guardada (<code>CasualMatchDetailScreen</code>) sí los pasaba, de ahí la diferencia. Ahora la <strong>primera imagen es idéntica a la guardada</strong>: pareja + resultado sobre pareja + resultado, sets debajo y el <strong>ganador resaltado en verde</strong> (props <code>homeName/homeScore/awayName/awayScore/highlight</code>, subtítulo Entreno/Amistoso y detalle VICTORIA/DERROTA · sets alineados con el detalle)." },

      { type: "fix", text: "<strong>Botón \"Compartir por WhatsApp\" eliminado</strong> (no hacía nada: <code>Linking.openURL('whatsapp://…')</code> fallaba en silencio). Quitados el botón, la función <code>shareWhatsapp</code> y el import <code>Linking</code>. Ahora tras guardar: con foto → botón principal <strong>\"Compartir foto + resultado\"</strong>; sin foto → <strong>\"Añadir foto del partido\"</strong> pasa a ser el botón principal; y un secundario discreto <strong>\"Compartir sólo el texto\"</strong> como respaldo. Se mantiene el botón de invitar a jugadores sin TACTIUM." },

      { type: "chore", text: "<strong>📡 OTA a production (runtime 1.2.0)</strong>. <code>eas update --branch production</code> (update group <code>c064e307</code>) con los dos fixes (solo JS/UI). Va al tren <strong>1.2.0</strong>: view-shot + expo-sharing solo existen en el build 18, así que la tarjeta compuesta se verá de verdad cuando las stores aprueben ese build; en binarios anteriores degrada a foto + texto sin romper." },
    ],
  },
  {
    date: "2026-07-14",

  {
    date: "2026-06-02",
    title: "IAP end-to-end real validado · webhook v7 con rescue + RPC sync robusto + Realtime de subs",
    changes: [
      { type: "decision", text: "<strong>Sesión maratoniana centrada en una sola cosa: que las compras IAP funcionen de verdad end-to-end</strong>. Tras el work del 27 may dejábamos handshake + 1 compra real OK pero un montón de aristas: sub fantasma viva en sandbox bloqueando tests, eventos llegando con app_user_id de users borrados, polling client mostrando \"Compra completada · Sincronizando…\" indefinido, mock fallback enmascarando configs rotas, y RC Restore sin path de recuperación cuando el webhook fallaba. Hoy hemos cerrado todo eso." },

      { type: "fix", text: "<strong>🔴 Webhook v6 · FK violation en UPSERT cuando el user no existe</strong>. Cada wipe de testing dejaba huérfanos eventos retrasados de RC asociados al UUID del user borrado. El handler hacía <code>upsert({payer_user_id: app_user_id, …})</code> → FK <code>subscriptions_payer_user_id_fkey</code> reventaba → 500 → RC reintenta agresivo → spam de 500. Fix: verificar existencia del user con <code>supabase.auth.admin.getUserById(app_user_id)</code> ANTES del UPSERT; si no existe, persistir el payload en <code>subscription_events</code> con sufijo <code>_IGNORED_UNKNOWN_USER</code> y responder 200. Aplicado mismo patrón a <code>_IGNORED_UNMAPPED_PRODUCT</code> y <code>_IGNORED_NO_TXN</code> para trazabilidad." },

      { type: "feat", text: "<strong>🚀 Webhook v7 · RESCUE en TRANSFER</strong>. Caso real visto en testing y posible en producción: user borra su cuenta Supabase, sigue logueado con el mismo Apple ID y compra algo; Apple lo trata como PRODUCT_CHANGE (sub fantasma viva en el subscription group); RC manda PRODUCT_CHANGE con <code>app_user_id</code> del user borrado → IGNORED por el check v6; luego RC manda TRANSFER moviendo del fantasma al user nuevo → no hay subs en DB que mover → no-op. <strong>Resultado sin v7</strong>: la compra real ocurrió pero NUNCA aterriza una sub en DB. <strong>Fix v7</strong>: si TRANSFER no encuentra nada que mover, busca el último evento relevante (<code>INITIAL_PURCHASE / PRODUCT_CHANGE / RENEWAL / UNCANCELLATION</code>) para los <code>fromUsers</code> en <code>subscription_events</code> — incluso si quedaron como <code>_IGNORED_UNKNOWN_USER</code> — y, si el <code>toUser</code> existe en <code>auth.users</code>, hace UPSERT de la sub con esos datos. Idempotente vía <code>onConflict: 'original_transaction_id'</code>." },

      { type: "fix", text: "<strong>🔴 Paywall · eliminado el mock fallback</strong>. Hasta hoy <code>handleStartTrial</code> tenía <code>if (pkg) { flow RC } else if (__DEV__) { mockPurchasePlan } else { toast error }</code>. Problema doble: (a) <code>__DEV__</code> resultaba ser <code>true</code> en TestFlight production por algún OTA viejo, así que el fallback se activaba en sandbox real; (b) aunque <code>__DEV__</code> fuese false en producción, el copy del toast era el mismo independientemente de por qué falló — ocultaba si la config de RC estaba rota o si solo faltaba el package. Removido completamente: <code>else { toast.error('Productos no disponibles', why) }</code> con copy distinto según <code>!offering</code> (RC sin offering current) vs <code>!pkg</code> (package no encontrado en offering). Console.warn deja huella para debug. <strong>El mock enmascaraba bugs reales que en producción dejarían a usuarios pensando que compraron algo que no se cobró</strong>." },

      { type: "feat", text: "<strong>Migración <code>sync_subscription_from_revenuecat</code> · path robusto desde cliente</strong>. RPC SECURITY DEFINER que el cliente puede llamar tras <code>restorePurchases()</code> exitoso. Acepta los datos del <code>customerInfo.entitlements.active</code> (<code>product_id</code>, <code>original_transaction_id</code>, <code>period_type</code>, <code>purchased_at_ms</code>, <code>expiration_at_ms</code>), mapea product_id → tier + billing_period, calcula status (<code>trialing</code> si TRIAL/INTRO, <code>active</code> resto) y hace UPSERT en <code>subscriptions</code> para <code>auth.uid()</code>. Idempotente por <code>onConflict: 'original_transaction_id'</code>. Audit log con <code>event_type='CLIENT_SYNC_FROM_RESTORE'</code>. GRANT solo a <code>authenticated</code>." },

      { type: "feat", text: "<strong>PaywallScreen · <code>handleRestore</code> robusto</strong>. Ya no confía únicamente en que el webhook RC → Supabase haya creado la fila; ahora itera <code>info.entitlements.active</code>, deriva un <code>stableTxnId = restore_${productId}_${originalPurchaseDateMs}</code> para idempotencia entre Restores múltiples, y llama a la RPC nueva por cada entitlement. Tras éxito, <code>refreshSubs(userId)</code> repinta UI sin esperar a Realtime. Esto cubre dos escenarios: (a) tu user dev borrado + sub fantasma viva en testing; (b) edge case real de producción si el webhook falla por cualquier razón — el user puede recuperarse con un Restore." },

      { type: "chore", text: "<strong>App-Specific Shared Secret de App Store</strong> configurado en RC dashboard (Project Settings → Apps → TACTIUM iOS). Sin esto el SDK RC en cliente no podía consultar el offering completo → <code>availablePackages</code> vacío → <code>pkg null</code> → caía al mock (cuando había mock) o al toast \"Productos no disponibles\" (tras quitarlo). Generado en App Store Connect → Información de la app → sección \"Secreto compartido específico de la app\" → Generar." },

      { type: "fix", text: "<strong>RC dashboard · package <code>elite_yearly</code> mal enlazado</strong>. En el offering <code>default</code>, el package <code>elite_yearly</code> apuntaba al producto <code>tactium_club_pro_yearly</code> (no <code>tactium_club_elite_yearly</code>). Si un user compraba Club Elite Anual, RC le cobraba el Pro Anual — más barato → Apple Review lo flaggea como pricing inconsistency. Arreglado a mano. Los otros 7 packages estaban OK." },

      { type: "fix", text: "<strong>🟡 Realtime de <code>subscriptions</code> no funcionaba</strong>. <code>subscriptionStore.subscribeRealtime</code> abría el canal Supabase y se quedaba escuchando, pero los eventos jamás llegaban — la tabla NO estaba en <code>supabase_realtime</code> publication. Mismo gotcha que el 25 may con <code>players</code>, <code>matchdays</code>, <code>lineups</code>, etc., pero <code>subscriptions</code> se quedó fuera del batch. Migración <code>enable_realtime_on_subscriptions</code>: <code>ALTER PUBLICATION supabase_realtime ADD TABLE public.subscriptions</code>. Tras esto, cambios de plan / renovaciones / expiraciones refrescan UI al instante en todos los devices del user sin pull." },

      { type: "feat", text: "<strong>Paywall · copy del link footer adaptativo</strong>. El link \"Continuar gratis\" tenía sentido para alguien sin sub abriendo el paywall en modo upgrade (le ofrecemos pagar; opta por seguir gratis). Pero para alguien que YA tiene premium y va a Perfil → Suscripción → Cambiar plan, tocar \"Continuar gratis\" no le deja gratis — le mantiene en su plan de pago. Cambio: si <code>existingSubForSubject</code> existe → texto y <code>accessibilityLabel</code> pasan a <em>\"Mantener plan actual\"</em>." },

      { type: "decision", text: "<strong>Apple Sandbox · sub fantasma del 27 may bloqueando todo testing limpio</strong>. La compra del 27 may dejó <code>original_transaction_id=2000001178232712</code> vivo en el Apple ID javierbadapalacio6@gmail.com (sandbox tester implícito). Llegó a renewal #8 (cuando sandbox debería expirar a las 6) y siguió cross-grading entre productos. Apple bloqueaba cualquier INITIAL_PURCHASE nuevo del mismo subscription group con \"ya tienes esta suscripción\". Workaround validado: testing en device nuevo con Apple ID limpio (sin estado previo) → INITIAL_PURCHASE limpio inmediato. Production users no tendrán este problema." },

      { type: "feat", text: "<strong>🎯 INITIAL_PURCHASE real validado end-to-end en device limpio</strong>. Compra de <code>tactium_club_elite_yearly</code>: sheet StoreKit + Face ID → INITIAL_PURCHASE llega al webhook v7 → sub creada con <code>platform='ios'</code>, <code>status='trialing'</code>, <code>original_transaction_id=2000001181407091</code> (id real Apple), <code>trial_end</code> set. Realtime repinta UI sin tocar nada. <strong>Sistema IAP funcionando end-to-end en sandbox real con device nuevo</strong>. Confirma que en producción real un usuario nuevo con Apple ID limpio va a fluir sin problemas." },

      { type: "decision", text: "<strong>Stripe en app móvil descartado · estrategia híbrida sigue vigente</strong>. Consulta del usuario sobre si \"podemos darle una vuelta a Stripe\". Recordada la decisión del 16 may guardada en memoria <code>tactium_payment_strategy</code>: Apple Guideline 3.1.1 + Google Play Payment Policy obligan IAP dentro de la app móvil — Stripe ahí = rechazo automático en review. Stripe SÍ en <code>tactium.io/cuenta</code> (Fase 2 post-lanzamiento) con la lógica Spotify (user paga en web → login en app → sub reconocida). Anti-steering rules: la app móvil NO puede mencionar precios web, solo link genérico permitido." },

      { type: "chore", text: "<strong>OTAs publicados</strong>: <code>89e9109b-…</code> (Plan A 27 may, retroactivamente identificado como bundle con <code>__DEV__=true</code> por error → causaba el mock), <code>ba1e9cfc-8b9f-4e0a-a45c-337a7e012392</code> (paywall sin mock, bundle production limpio), <code>39c80d28-0519-451a-94bd-fae55510da82</code> (handleRestore robusto), <code>55b61da1-1d69-4e96-9fef-9faa897da4e0</code> (copy \"Mantener plan actual\"). Todos en branch <code>production</code>, runtime 1.0.0." },

      { type: "chore", text: "<strong>Limpiezas operativas durante la sesión</strong>: múltiples wipes de Supabase para arrancar testing fresco, eliminación manual de subs duplicadas (3 subs activas para el mismo subject tras un ciclo de Restore + cross-grade), <code>database.types.ts</code> regenerado con la firma de <code>sync_subscription_from_revenuecat</code>." },

      { type: "decision", text: "<strong>Cierre del bloque IAP · arrancamos limpieza Perfil en la misma sesión</strong>. Tras validar el sistema de compras end-to-end, pasamos a (a) auditar botones sin funcionalidad en ProfileScreen, (b) arreglar el logo TACTIUM del hero del Paywall. La sub fantasma del 27 may queda para que expire sola en sandbox; el sistema en producción real ya está validado." },

      { type: "fix", text: "<strong>Paywall · logo TACTIUM invisible en el hero</strong>. Se usaba <code>&lt;TactiumMark size={64} gradient /&gt;</code>. El prop <code>gradient</code> pinta un squircle dark color <code>Colors.bgCard</code> detrás del logo (pensado para masa visual a tamaños pequeños sobre cards). Pero el Paywall tiene fondo <code>Colors.background</code> que es prácticamente el mismo verde oscuro, así que el squircle se camuflaba y solo se intuía un cuadradito raro sin destacar el logo. Fix: quitar <code>gradient</code> en el hero (queda <code>&lt;TactiumMark size={64} /&gt;</code>). El isotipo se ve grande, limpio y reconocible — sin caja de fondo." },

      { type: "feat", text: "<strong>🔴 ProfileScreen · ZONA DE PELIGRO con \"Eliminar cuenta\"</strong>. Requisito Apple Guideline 5.1.1(v) y Google equivalente: si la app permite registro, DEBE permitir eliminar la cuenta desde la propia app. Sin esto, rechazo casi seguro en el submit a la App Store. Migración <code>delete_my_account_rpc</code>: RPC SECURITY DEFINER que (a) bloquea si hay sub premium activa con error <code>active_subscription</code> + HINT pidiendo cancelar primero en App Store / Google Play (sin esto el user borraría la DB pero Apple seguiría cobrándole), (b) <code>DELETE FROM auth.users WHERE id = auth.uid()</code> y deja que el CASCADE limpie todo el árbol (profiles, clubs propios + sus teams/seasons/matchdays/lineups/match_results, teams independientes, club_members, team_members, team_invitations, subscriptions canceladas). <code>availability.updated_by</code> y <code>players.user_id</code> quedan en <code>SET NULL</code> → preservan historial sin huérfanos." },

      { type: "chore", text: "<strong>Doble confirmación destructive en cliente</strong>. UI: nueva sección \"ZONA DE PELIGRO\" al final del Perfil (label en rojo apagado, separada visualmente del resto), botón con fondo rojo sutil + hint inferior recordando lo de la sub. Tap → Alert 1 \"Esto borrará tu perfil, equipos, jornadas, alineaciones, resultados e invitaciones. ESTA ACCIÓN ES IRREVERSIBLE\" → Continuar → Alert 2 \"¿Seguro al 100%? No podremos recuperar tus datos. Si tienes una suscripción activa en App Store o Google Play, cancélala primero o seguirán cobrándote\" → Sí, eliminar. Tras éxito → <code>signOut</code>. Loading state durante la llamada. Servicio en <code>core/services/profile.ts:deleteMyAccount</code> traduce el error <code>active_subscription</code> a copy humano antes de surfacearlo al toast." },

      { type: "feat", text: "<strong>ProfileScreen · avatar de foto desde cámara o galería</strong>. Migración <code>avatars_bucket_and_policies</code>: bucket público <code>avatars</code> en Storage (max 3 MB, MIME jpeg/png/webp), estructura de paths <code>{user_id}/avatar_{ts}.{ext}</code> con timestamp para cache-bust en CDN. 4 RLS policies: SELECT público para que los teammates vean los avatares, INSERT/UPDATE/DELETE solo para el dueño del path (<code>(storage.foldername(name))[1] = auth.uid()::text</code>). Service <code>core/services/avatar.ts</code> con <code>uploadMyAvatar(uri)</code> (fetch + ArrayBuffer + upload + cleanup de archivos antiguos del mismo user + actualiza <code>profiles.avatar_url</code>) y <code>deleteMyAvatar()</code> (borra todo + clear). UI: avatar wrappeado en <code>Pressable</code>, badge cámara 📷 abajo-derecha como affordance visual, tap abre Alert con opciones <em>Hacer foto / Elegir de galería / Quitar foto / Cancelar</em>. ImagePicker con <code>aspect:[1,1]</code> + <code>allowsEditing</code> + quality 0.7 para mantener archivos &lt;500KB. Loading spinner en el badge durante la subida. Render condicional: <code>avatar_url</code> presente → <code>&lt;Image&gt;</code>, ausente → fallback iniciales actuales." },

      { type: "feat", text: "<strong>ProfileScreen · \"Mis datos\" con export GDPR</strong>. Reemplaza el placeholder \"Privacidad · PRONTO\" que llevaba meses sin implementar. Migración <code>export_my_data_rpc</code>: RPC SECURITY DEFINER que devuelve <code>jsonb</code> con todo lo que el RGPD Art. 20 (right to data portability) exige — profile, clubs propios, club_memberships, teams propios, team_memberships, players vinculados, subscriptions (sin PII de billing, ya REVOKED en columna), invitations creadas + metadata con timestamp/user_id/gdpr_article. Nueva pantalla <code>MyDataScreen</code> registrada en RootStack como card modal: lede explicativo, sección CUENTA (email, nombre, fecha registro, ID truncado), sección RESUMEN con count pills por categoría (clubes, equipos, jugadores, subs, invitaciones), botón verde \"Compartir mis datos (JSON)\" → abre Share sheet nativo con el JSON formateado pretty (el user lo manda a Notas, Mail, Drive, AirDrop, lo que quiera), sección POLÍTICAS con links a <code>tactium.io/legal/privacy</code> y <code>tactium.io/legal/terms</code>." },

      { type: "chore", text: "<strong>ProfileScreen · limpieza de items sin roadmap</strong>. Sección CUENTA tenía 4 items: Notificaciones (toggle real ✓) + Apariencia/Idioma/Privacidad como placeholders con badge <em>PRONTO</em> desde hacía meses. Tras añadir \"Mis datos\" (reemplaza Privacidad), quitamos también Apariencia (la app es dark-only por diseño de marca, sin roadmap de light mode) e Idioma (ES-only por mercado inicial, sin roadmap inmediato de i18n). Sección CUENTA queda con Notificaciones + Mis datos — ambos funcionales — más limpio." },

      { type: "chore", text: "<strong>OTAs publicados en esta sub-sesión</strong>: <code>55b61da1-…</code> (copy paywall \"Mantener plan actual\"), <code>2d1e32d9-…</code> (zona de peligro + eliminar cuenta + fix logo paywall), <code>2b9e41c7-…</code> (avatar de foto), <code>f4b59870-…</code> (Mis datos + RPC export_my_data), y un último publicándose al cerrar la sesión con la limpieza de placeholders. Todos en branch <code>production</code>, runtime 1.0.0." },

  {

      { type: "feat", text: "<strong>Primera compra IAP REAL end-to-end · sandbox iOS</strong>. Sandbox Tester logueado en iPhone (Ajustes → App Store → Sandbox Account). Compra de <code>tactium_captain_yearly</code> → StoreKit sheet → Face ID → vuelta a la app → polling encuentra la sub que el webhook insertó. <code>subscription_events</code> registra <code>INITIAL_PURCHASE</code> con <code>period_type='TRIAL'</code>, <code>price=0</code>, <code>currency='EUR'</code>, <code>country_code='ES'</code>, <code>entitlement_ids:['captain']</code>, <code>original_transaction_id</code> real de Apple (<em>2000001178232712</em>). Sub creada con <code>platform='ios'</code>, <code>product_id='tactium_captain_yearly'</code>, <code>status='trialing'</code>. <strong>Integración Apple StoreKit → RC → webhook → Supabase confirmada</strong>." },

      { type: "fix", text: "<strong>🔴 BUG · RC <code>subscriber_attributes</code> no propagan a tiempo en INITIAL_PURCHASE</strong>. Detectado al probar flow club_admin: el user crea club, va al paywall, compra <code>tactium_club_starter_yearly</code>, pero al volver a la app el cliente dice <em>'el club no tiene plan activo'</em> al intentar crear team. Causa: <code>Purchases.setAttributes({$target_subject_type:'club', $target_subject_id:clubId})</code> es <strong>async fire-and-forget</strong> en el SDK; cuando <code>purchasePackage</code> se ejecuta inmediatamente después, los attrs aún no llegaron al backend de RC. El evento INITIAL_PURCHASE llega sin <code>$target_subject_*</code> → el webhook <code>resolveSubject()</code> cae al default <code>subject_type='user'</code> con <code>app_user_id</code> → la sub se inserta como user en lugar de club → el cliente no la encuentra al buscar por <code>(subject_type='club', subject_id=clubId)</code>." },

      { type: "fix", text: "<strong>🔧 Polling cambiado a buscar por <code>payer_user_id + plan_tier</code></strong> (antes: <code>subject_type + subject_id</code>). Razón directa del mismo bug: si el webhook insertó la fila con subject=user pero esperábamos subject=club, el polling no la encontraba. Filtrar por payer+tier la encuentra sin importar el subject mal asignado. Renombrado <code>pollForNewSubscription</code> → <code>pollForRecentSubscription</code> con esa nueva semántica." },

      { type: "chore", text: "<strong>Rotación del secret <code>REVENUECAT_WEBHOOK_AUTH</code></strong>. Como precaución (el secret original había estado expuesto en chat), generamos un nuevo secret de 32 bytes hex tras validar el handshake. Aplicado en Supabase Edge Function secrets vía <code>supabase secrets set --env-file</code> y actualizado en RC dashboard. El secret antiguo queda muerto al instante." },

      { type: "chore", text: "<strong>Reparación manual de la sub corrupta del testing</strong>. La fila <code>75da1246</code> (compra real del flow club) tenía <code>subject_type='user'</code> aunque era plan club_*. UPDATE manual a <code>subject_type='club', subject_id='287c489a-...'</code> (Club Starter del user). Tras este UPDATE, el cliente ya encuentra la sub al buscar por club → flow desbloqueado en TestFlight." },

      { type: "chore", text: "<strong>OTA fix publicado</strong> (Update group <code>89e9109b-...</code>, iOS update <code>019e6b70-1bb2-7681-...</code>) con el cambio del polling + llamada al RPC. Tras kill+reopen en TestFlight, el flow club empieza a comportarse bien: nuevas compras club_* se enlazan automáticamente al club destino sin necesidad de reparación manual." },

      { type: "decision", text: "<strong>Apple Sandbox · <code>expiration_at_ms</code> del free trial llega como +24h aunque el intro offer sea 2 weeks</strong>. El payload del INITIAL_PURCHASE mostraba <code>purchased_at_ms = 2026-05-27 21:38:28</code> y <code>expiration_at_ms = 2026-05-28 21:38:28</code> — exactamente +24h. Verificado en App Store Connect que el intro offer ESTÁ configurado como <em>Gratis las primeras 2 semanas</em> para 175 países (mensual y anual). NO es bug nuestro: Apple Sandbox no respeta la duración real del intro offer en el timestamp, manda un placeholder simbólico. En producción real con Apple Production, <code>expiration_at_ms = purchased_at_ms + 14 días</code> reales. Confirmado también que los eventos posteriores en sandbox llegan en tiempo comprimido (<code>RENEWAL</code> y <code>PRODUCT_CHANGE</code> recibidos a los ~3-5 min tras la compra inicial)." },

      { type: "decision", text: "<strong>Pre-requisitos validados en App Store Connect</strong>: (a) Intro Offer <em>Free 2 weeks</em> configurado para los 8 productos en los 175 países; (b) Sandbox Tester creado y logueado en el iPhone (Ajustes → App Store → Sandbox Account); (c) submission group de subs activo." },

  {
    date: "2026-05-27",
    title: "Security review + simplify + CRO paywall y onboarding · sesión de pulido pre-launch",
    changes: [
      { type: "decision", text: "<strong>Sesión enfocada en pulido pre-launch</strong> usando 3 skills en cadena: <code>/security-review</code>, <code>/simplify</code>, <code>/paywall-upgrade-cro</code> + <code>/onboarding-cro</code>. Se aplicaron los hallazgos accionables; los que requerían refactor grande quedaron como notas para sesiones posteriores. <code>/review</code> (ultrareview cloud, billing-gated) lo deja el usuario para lanzar cuando convenga." },

      { type: "feat", text: "<strong>🔴 CRITICAL · PII de billing oculta a team_members del club</strong>. La RLS de <code>subscriptions</code> ampliada el 26 may exponía <code>revenuecat_customer_id</code> y <code>original_transaction_id</code> a TODOS los team_members del club (cualquier player podía leerlos vía SELECT). HOY con mocks es UUID/string sintético, pero cuando RevenueCat real esté integrado serán PII de billing aprovechables para account-takeover en RC dashboard o lookup de refunds. Migración <code>restrict_billing_pii_columns_on_subscriptions</code>: <code>REVOKE SELECT (revenuecat_customer_id, original_transaction_id)</code> para <code>authenticated</code> y <code>anon</code> — solo <code>service_role</code> (webhooks RC) los ve. Cliente refactorizado: 3 sitios de <code>select('*')</code> sustituidos por columnas explícitas vía constante <code>SUB_VISIBLE_COLS</code> exportada desde <code>services/subscriptions.ts</code> e importada por el store." },

      { type: "feat", text: "<strong>🟡 MEDIUM · Trigger DB bloquea editar alineación en temporada cerrada</strong>. El cliente bloqueaba en UI desde el sprint anterior, pero la RLS de <code>lineups</code>/<code>lineup_variants</code> solo validaba <code>is_team_admin</code> — un captain con conocimiento técnico podía editar via API directa. Nueva migración <code>enforce_season_active_for_lineup_edits</code>: trigger BEFORE INSERT/UPDATE/DELETE en <code>lineups</code> y <code>lineup_variants</code> que aborta si la season padre está archivada. <code>match_results</code> intencionadamente EXCLUIDO — registrar acta tras cerrar temporada sigue siendo válido (decisión de producto)." },

      { type: "chore", text: "<strong>🟢 LOW · GRANT hygiene en RPC</strong>. <code>start_subscription_trial</code> podía ser ejecutado por <code>anon</code> (aunque la función rechazaba con <code>auth.uid()=null</code>). Defense-in-depth: <code>REVOKE EXECUTE FROM public, anon</code>. Solo <code>authenticated</code> y <code>service_role</code>." },

      { type: "chore", text: "<strong>Simplify · 4 fixes de bajo riesgo</strong>. (1) Export de <code>SUB_VISIBLE_COLS</code> centralizado para que el store no duplique el string de columnas; (2) <code>PREMIUM_STATUSES</code> import en <code>hasAnyActiveSub</code> en lugar de array literal stringly-typed; (3) eliminado <code>useEffect</code> duplicado en JornadaScreen que llamaba a <code>load()</code> además del <code>useFocusEffect</code> (fetch x2 en mount); (4) <code>initials</code> inline en ProfileScreen (5 líneas) sustituido por <code>initialsOf()</code> del helper existente." },

      { type: "feat", text: "<strong>Paywall · copy completamente reescrito en clave pain-led</strong>. Hero título Club: <em>'Tu club, sin Excel ni WhatsApp'</em> (antes: 'Pásate a Club'). Hero título Capitán: <em>'Tu próxima alineación, en 90 segundos'</em>. Lede acorde. Value props giran de feature-led a dolor real: 'Convocatorias en 1 toque, sin chats de 80 mensajes', 'Parejas equilibradas por puntos automáticamente', 'Calendario y rankings escaneados desde la federación', 'Tus jugadores avisan si pueden o no, sin perseguir a nadie'. CTA: <em>'Probar gratis 14 días'</em> (antes: 'Empezar prueba 14 días')." },

      { type: "feat", text: "<strong>Paywall · trust line bajo el CTA</strong>. La línea <em>'14 días gratis · Sin compromiso · Cancela cuando quieras'</em> estaba enterrada en el disclaimer legal de 11px. Ahora aparece como microcopy en verde directamente debajo del botón, justo donde la confianza tiene que aterrizar antes del tap." },

      { type: "feat", text: "<strong>Paywall · plan cards con sub-line de fit + savings en €</strong>. Cada card ahora muestra para quién es el plan ('Para 1 capitán · gestiona tu equipo', 'Hasta 3 equipos · clubes pequeños', 'Hasta 10 equipos · la mayoría de clubes federados', 'Hasta 25 equipos · escuelas y academias'). El ahorro anual pasa de '-20%' abstracto a 'Ahorras 11,89 € al año' concreto, calculado por plan. Badge 'RECOM.' → <em>'MÁS ELEGIDO'</em>." },

      { type: "feat", text: "<strong>Paywall · social proof honesto</strong>. Sin números reales todavía, añadida una línea entre value props y plan toggle: <em>'HECHO CON CAPITANES FEDERADOS DE TODA ESPAÑA'</em> (mono, uppercase, mute). Cuando tengamos waitlist count o users activos lo cambiamos a '+N capitanes alinean en TACTIUM'." },

      { type: "feat", text: "<strong>TrialStartedModal · checklist 3 pasos en lugar de value props genéricos</strong>. Tras arrancar el trial el modal mostraba 4 features sueltas ('alineaciones inteligentes', 'variantes ilimitadas', etc.). Sustituidas por el checklist de activación: <em>'Añade los jugadores de tu equipo · Escanea el calendario de tu liga · Recibe tu primera alineación sugerida'</em> — orienta al user hacia el aha moment en lugar de listar features." },

      { type: "feat", text: "<strong>🚀 Paywall ahora va DESPUÉS de CreateTeam en flow Equipo independiente</strong>. Antes: OnboardingChoice → Paywall (cold ask) → CreateTeam. Cambio: OnboardingChoice → CreateTeam (form, no crea) → Paywall (con sunk-cost del form ya rellenado) → tras success se crea el team + va a AddPlayers. <code>OnboardingStackParamList.Paywall</code> añade <code>pendingTeam?: { name, federation, league, category, group, gender }</code> que <code>CreateTeamScreen</code> pasa via route params. <code>PaywallScreen.handleStartTrial</code> tras éxito llama a <code>createTeam(pendingTeam)</code> antes de navegar a <code>AddPlayers</code>. El trigger DB <code>enforce_team_quota</code> sigue intacto y enforce desde server porque la sub user/captain se inserta primero, después el team." },

      { type: "feat", text: "<strong>Home empty state → 'Escanear calendario' como CTA primario</strong>. Cuando hay activeSeason pero sin jornadas, el copy del empty state pasa a <em>'Escanea el calendario de tu liga y TACTIUM importa todas las jornadas de un golpe'</em>. Botón verde primario <em>'Escanear calendario'</em> abre el ScanSheet directamente via nueva route param <code>SeasonsStackParamList.SeasonDetail.autoOpen='scan'</code>. Secundario discreto <em>'Añadir manualmente'</em> para el path antiguo. El user ya no tiene que descubrir el icono 📷 enterrado en SeasonDetail." },

      { type: "chore", text: "<strong>Paywall · ocultado 'Restaurar compras' hasta RevenueCat real</strong>. El link existía pero al pulsarlo solo emitía un toast <em>'Disponible más adelante'</em> — riesgo de rechazo en Apple Review (Guideline 3.1.1 espera funcionalidad real). Botón y función <code>handleRestore</code> eliminados con comentario explicativo para reactivar cuando RevenueCat SDK esté integrado y llame a <code>Purchases.restorePurchases()</code>." },

      { type: "chore", text: "<strong>JornadaScreen</strong>: <code>useMatchdayRealtime({ matchdayId: matchday?.id, onChange: load })</code>. La función <code>load</code> ya hacía el refetch completo (matchday + season + lineup activo + results), se reutiliza tal cual." },

  {

    title: "Paywall hard gate · quota server-side · auto-trial triggers eliminados",
    changes: [
      { type: "feat", text: "<strong>Paywall obligatorio en onboarding</strong>. Hasta hoy el paywall era cosmético: un usuario podía completar el setup sin elegir plan y la app le dejaba operar sin restricciones hasta que entraba a Perfil. Ahora ambos flows (Club / Equipo independiente) tienen <em>hard gate</em>: sin pulsar 'Empezar prueba 14 días' o 'Salir y cerrar sesión' no se entra a la app." },
      { type: "feat", text: "<strong>OnboardingChoiceScreen</strong>: la card 'Tengo un código de invitación · SIEMPRE GRATIS' pasa a ser <em>'Soy jugador'</em> con subtítulo 'Necesitas el código que te envíe tu capitán o tu club'. Copy más natural para la persona invitada." },
      { type: "feat", text: "<strong>PaywallScreen · modo onboarding</strong>. Detecta el modo por la presencia de <code>route.params.nextScreen</code>. En ese modo: oculta la X del header (no hay escape por arriba), bloquea el back hardware de Android con <code>useFocusEffect + BackHandler</code>, sustituye el link 'Continuar gratis' por 'Salir y cerrar sesión' (Alert de confirmación → <code>signOut</code>), y tras <code>handleStartTrial</code> hace <code>navigation.replace(nextScreen)</code> en lugar de <code>goBack</code>." },
      { type: "fix", text: "<strong>Bug 'elegí capitán pero aparezco como club'</strong>. Diagnóstico vía SQL: <code>prueba1@gmail.com</code> tenía <code>sub_create</code> con timestamp <em>idéntico</em> al <code>club_create</code> (15:35:34). La sub no la creaba el paywall, la creaban triggers DB <code>clubs_start_trial</code> / <code>teams_start_trial</code> en la misma transacción del INSERT. <code>fn_start_trial_for_subject</code> tiene un guard <code>if v_existing_count > 0 then return</code> que ignoraba silenciosamente el plan elegido en el paywall. Sumado a eso, <code>PaywallScreen</code> decidía qué tier mostrar via <code>activeRole</code>, que era <code>null</code> justo tras CreateClub (sin team todavía) → enseñaba plan Capitán en flow Club." },
      { type: "decision", text: "<strong>Paywall = source of truth de las suscripciones</strong>. Drop de los triggers <code>clubs_start_trial</code> y <code>teams_start_trial</code> + sus funciones (<code>tg_clubs_start_trial</code>, <code>tg_teams_start_trial</code>). Nueva RPC pública <code>start_subscription_trial(subject_type, subject_id, plan_tier)</code> SECURITY DEFINER con validación de ownership (owner del club o <code>subject_id === auth.uid()</code>). Delega en <code>fn_start_trial_for_subject</code>. El paywall ahora llama a esta RPC al pulsar 'Empezar prueba' → la sub se crea con el plan REAL que eligió el usuario." },
      { type: "chore", text: "<strong>mockPurchasePlan</strong>: cuando <code>startTrial=true</code> y no hay sub existente para el subject, llama al RPC <code>start_subscription_trial</code> en lugar de hacer INSERT directo (que RLS rechazaba en prod y devolvía optimistic-only en dev). Devuelve la fila real persistida en DB. Tipos regenerados en <code>database.types.ts</code>." },
      { type: "chore", text: "<strong>PaywallScreen · plan visible</strong>: en modo onboarding usa <code>intent</code> del route param (<code>'captain' | 'club'</code>) para decidir qué familia de planes mostrar, en lugar de <code>activeRole</code>. Fuera de onboarding (modal de upgrade desde Profile) sigue confiando en <code>activeRole</code>." },
      { type: "fix", text: "<strong>AuthApiError: Invalid Refresh Token: Refresh Token Not Found</strong>. Causa: refresh token persistido apunta a sesión que ya no existe (típico al borrar un usuario del dashboard mientras la app aún tenía cacheada su sesión). Fix defensivo en <code>authStore.hydrate</code>: tras <code>getSession()</code> hace <code>getUser()</code> para validar contra servidor; si falla, <code>signOut()</code> que limpia tokens caducos. La próxima auto-renovación ya no tiene nada que renovar y el error en consola desaparece." },
      { type: "feat", text: "<strong>Quota de equipos enforzada en onboarding (cliente)</strong>. <code>CreateTeamsForClubScreen</code> no tenía ningún check de cuota — un usuario en club_starter (quota 3) podía meter 4+ equipos durante el setup inicial. Ahora lee la sub activa del club desde <code>subscriptionStore</code>, deriva <code>currentPlan + quotaReached</code>, y bloquea en <code>onAdd</code> con Alert. UI: counter <code>'01 / 03 STARTER'</code>, botón '+ Añadir equipo' sustituido por card dashed 'Has alcanzado el máximo del plan Starter · Podrás mejorar el plan después desde Perfil' cuando estás en quota, confirm del form inline también deshabilitado." },
      { type: "decision", text: "<strong>Modelo de roles 'solo club, no club+capitán' APARCADO</strong>. El usuario propuso que un founder dejara de ser club_admin+captain a la vez (modelo dual actual). Hablado: implica refactor grande (selectIsCaptain → aceptar club_admin para editar, drop del trigger handle_team_owner cuando es admin del club padre, migración de team_members existentes, eliminar pestaña 'Equipos' read-only o convertirla editable). Decisión: posponer. Modelo dual sigue vivo." },
      { type: "feat", text: "<strong>Quota server-side · defensa en profundidad</strong>. El guard cliente fallaba por timing (si <code>subscriptionStore</code> no había refrescado, <code>currentPlan</code> era null y el check <code>if (currentPlan && ...)</code> evaluaba false). Verificado en DB: <code>club1@gmail.com</code> tenía un club con 4 equipos en plan starter (quota 3). Nuevo trigger <code>enforce_team_quota</code> BEFORE INSERT en <code>public.teams</code> que valida sub activa del subject + compara con quota hardcoded del tier. Cubre los 4 tiers: Capitán 1, Starter 3, Pro 10, Elite 25." },
      { type: "chore", text: "<strong>Flow 'Equipo independiente' reordenado</strong>. Antes: <code>OnboardingChoice → CreateTeam (crea team) → Paywall → AddPlayers</code>. Ahora: <code>OnboardingChoice → Paywall (crea sub captain) → CreateTeam (insert pasa el trigger) → AddPlayers</code>. El paywall va ANTES del INSERT porque el trigger DB exige sub activa. Flow Club sin cambios (CreateClub → Paywall → CreateTeamsForClub) porque ahí el club se crea antes pero ningún team se inserta hasta después del paywall." },
      { type: "chore", text: "<strong>Limpieza de dato sucio</strong>: borrado del 4º team (<em>Jejeje</em>) del club <code>dc62f33b</code> (Club Final · club1@gmail.com) que estaba over-quota desde antes de aplicar el trigger. Cascade limpio a <code>team_members</code> / <code>players</code> / <code>seasons</code> / <code>team_invitations</code>. Auditoría confirma 0 clubs over-quota y 0 teams independientes huérfanos." },
      { type: "decision", text: "<strong>Cambio de plan POST-TRIAL · pendiente</strong>. Para upgrades/downgrades fuera del trial el patrón estándar es: upgrade inmediato con prorrateo (Apple/Google lo gestionan nativamente vía StoreKit/Play Billing y RevenueCat te envía el PRODUCT_CHANGE webhook), downgrade al final del periodo. Aparcado hasta la integración real de RevenueCat — hoy <code>mockPurchasePlan</code> solo arranca trials nuevos." },
      { type: "docs", text: "<strong>Memoria nueva</strong>: <code>tactium-paywall-source-of-truth.md</code> documenta el modelo (paywall crea las subs vía RPC, triggers de auto-trial eliminados, enforcement de quota server-side, orden de pasos en cada flow del onboarding). Reemplaza implícitamente lo que dijera <code>tactium-role-model</code> sobre auto-creación de trials." },
      { type: "chore", text: "<strong>Migraciones aplicadas en Supabase</strong>: <code>paywall_as_subscription_source_of_truth</code> (drop triggers + add RPC) y <code>enforce_team_quota_server_side</code> (trigger de cuota). Ambas verificadas: trigger bloquea correctamente un INSERT en club over-quota con error en español listo para mostrar al usuario." },
    ],
  },
  {
    date: "2026-05-18",
    title: "Tandas como distribución · polish jornada y seasons",
    changes: [
      { type: "feat", text: "<strong>Tandas re-modeladas: de entero a distribución</strong>. La sesión anterior añadió <code>matchdays.tanda integer</code> pensando que una tanda era 'turno en el que juega este partido'. Feedback del capitán: lo que importa es cómo se reparten las parejas del equipo entre los turnos dentro de la jornada. Para 3 parejas la combinatoria es <code>1-1-1</code>, <code>1-2</code>, <code>2-1</code>, <code>3</code> — todas las composiciones ordenadas que suman al nº de pistas. Migración: drop <code>tanda integer</code>, add <code>tandas text</code> (formato <code>N-N-N…</code>)." },
      { type: "feat", text: "Nuevo helper <code>core/utils/tandas.ts</code> con <code>compositionsOf(n)</code> y <code>tandasOptions(n)</code> que devuelve las <code>2^(n-1)</code> composiciones ordenadas por nº de turnos (menos turnos primero — más natural para liga regular)." },
      { type: "feat", text: "<code>AddMatchdaySheet</code> y <code>EditMatchdaySheet</code> sustituyen el input numérico por un <strong>TandasPicker</strong>: scroll horizontal de chips, primer chip <em>Sin tanda</em> (null), luego cada opción generada a partir de <code>courts</code>. <code>MatchdayRow</code> muestra el literal <code>· 1-2</code> / <code>· 1-1-1</code> en la meta cuando hay valor, oculto si null." },
      { type: "chore", text: "<strong>Jornada · InfoCard</strong>: cuando un capitán abre una jornada con tanda configurada, se muestra en el mismo bloque meta-grid que fecha y sede, con <code>IconCourt</code> y los estilos existentes. Fila oculta cuando <code>matchday.tandas</code> es null (muchas ligas amateur no usan turnos y una fila <em>Sin tanda</em> sería ruido)." },
      { type: "chore", text: "Eliminado el subtítulo redundante <em>Distribución de parejas</em> bajo <code>Tandas 1-1-1</code> — el valor ya transmite el significado al capitán que lo eligió, el subtexto era relleno." },
      { type: "fix", text: "Spinner residual del <strong>CreateSeasonSheet</strong> (reportado de nuevo): el sheet queda montado permanentemente controlado por <code>open</code>, así que un <code>submitting=true</code> previo persistía entre cierres y reaparecía con el spinner girando y el form deshabilitado. Reset <code>setSubmitting(false)</code> en el <code>useEffect</code> de <code>open=true</code>. Defensa equivalente aplicada a <code>AddMatchdaySheet</code>." },
      { type: "chore", text: "<strong>Cerrar temporada · copy reescrito</strong>. El warning previo decía <em>'estas jornadas se mantendrán sin resultado en el histórico'</em>, lo que sugería pérdida de datos. La realidad es la opuesta: cerrar temporada solo bloquea <em>añadir nuevas</em> jornadas y editar metadatos; las jornadas pendientes siguen abriéndose desde la lista y JornadaScreen permite registrar resultados o cerrar acta cuando el capitán se ponga al día. Alert reescrita en clave tranquilizadora: <em>'No pasa nada — podrás abrirlas más adelante…'</em>. Pluralización 1/N manejada." },
      { type: "chore", text: "<strong>Cards de temporada más densas y team-aware</strong>. Antes: <code>ACTIVA · LIGA</code> / <code>Temporada 26/27</code> / <code>Federada · 18 jornadas</code>. Ahora: badge fase abreviada (<code>L</code>/<code>P</code>/<code>L+P</code>) + meta construida con datos del equipo activo (<code>TEAM · LEAGUE · CAT</code>). Helper <code>phaseShortLabel</code> y <code>buildSeasonMeta</code> con filtro Boolean para evitar bullets colgantes cuando falta un campo. Aplicado a <code>ActiveSeasonCard</code> y <code>PastSeasonCard</code>." },
      { type: "chore", text: "5 commits del día (<code>3db89c84 → 72f6a883</code>) ya en <code>origin/main</code>." },
    ],
  },
  {
    date: "2026-05-17",
    title: "Equipos tab club_admin · ciclo de temporadas + polish jornada",
    changes: [
      { type: "fix", text: "<strong>ProfileScreen flash residual</strong>: el <code>AmbientBackdrop</code> SVG seguía pestañeando en el mount inicial. Eliminado el SVG ambient en favor del fondo plano de la pantalla. Refactor adicional: fetches de mount-time movidos a <code>useFocusEffect</code> para que el avatar y los stats se carguen al ENTRAR en la pantalla, no al construirla (commits <code>394d373f</code>, <code>82ecd2bd</code> arrastrados de la tarde del 16 may)." },
      { type: "fix", text: "<strong>CreateTeamFromClubScreen</strong>: el form de crear equipo arrancaba con categorías preseleccionadas residuales. Ahora arranca limpio y el selector de categoría sube hasta <em>10ª</em> (commit <code>f740a72d</code>, también del 16 may pm)." },
      { type: "feat", text: "<strong>Refinado el modelo de roles · club_admin ≠ capitán auto-elevado</strong>. Hasta ahora <code>selectIsCaptain</code> hacía <code>activeRole === 'captain' || 'club_admin'</code>, lo que daba a un club_admin permisos de edición en línupes/resultados/jornadas. Demasiado promiscuo. Eliminada la rama <code>|| 'club_admin'</code>: desde este commit solo <code>activeRole === 'captain'</code> habilita edición a través de los guards de UI existentes. La RLS en Supabase ya permitía ambos, así que el cambio visible es puramente de gating UI." },
      { type: "feat", text: "<strong>Nueva pestaña 'Equipos' para club_admin</strong> (entre Club y Perfil). <code>ClubTeamsScreen</code>: lista vertical de todos los equipos del club con resumen por card (jugadas/total · win rate · plantilla). <code>ClubTeamPreviewScreen</code>: dashboard dedicado de cada equipo en modo lectura con stats jugadas/ganadas/perdidas/empate, NextMatchdayCard y lista de jornadas. Tap en cualquier jornada navega a <code>JornadaScreen</code> (reusada, automáticamente read-only porque <code>selectIsCaptain=false</code> para club_admin)." },
      { type: "feat", text: "<strong>ClubTeamsStack</strong> SOLO registra <code>JornadaScreen</code>/<code>LineupScreen</code>/<code>ResultsScreen</code> desde el home stack — <em>NO</em> registra <code>HomeScreen</code> ni <code>AvailabilityScreen</code>. El club_admin nunca puede llegar a 'Crear temporada', 'Crear jornada' ni 'Disponibilidad' desde esta pestaña. Literalmente no hay path UI para crear o editar nada aquí. <code>HIDE_TAB_BAR_ON</code> añade <code>ClubTeamPreview</code> para ocultar la tab bar flotante en drill-down." },
      { type: "chore", text: "<strong>Eliminado el label SOLO LECTURA</strong> de las vistas Equipos del club_admin. La ausencia de botones de edición ya transmite el modo claramente — el badge añadía ruido sin valor (<code>ClubTeamsScreen</code> y <code>ClubTeamPreviewScreen</code>)." },
      { type: "feat", text: "<strong>Cards del Club Dashboard ahora son Pressable</strong>. <code>NextMatchdayCard</code> y <code>LastResultCard</code> hacen <code>setActiveTeam(team.id)</code> + navigate a Jornada(matchdayId). La pantalla abre en el mismo ClubStack, sin tab-switch — se siente nativo al flow del dashboard. <code>ClubStackParamList</code> extendido para tipar las nuevas rutas." },
      { type: "feat", text: "<strong>Jornada cerrada · CTA reemplazado</strong>. Una jornada finalizada ya muestra las parejas con su outcome por pista inline, así que el botón <em>Ver alineación</em> no aportaba nada. Sustituido por <em>Volver</em> (<code>goBack + IconCheck</code>). Los casos editables conservan su CTA original <em>Editar/Crear alineación</em>." },
      { type: "fix", text: "<strong>Validación de marcador manual cuando se cierra acta</strong>. Antes aceptaba cualquier 0-99, así que un capitán podía cerrar un partido federado de 3 pistas con <code>10-0</code>. Ahora los dos inputs hacen clamp a <code>courts</code> en cada keystroke y los botones de outcome se deshabilitan salvo que <code>scoreFor + scoreAgainst === courts</code>. El hint se convierte en <em>'El marcador debe sumar X (total de pistas). Llevas Y'</em> mientras la suma no cuadra — el capitán sabe exactamente qué le falta." },
      { type: "feat", text: "<strong>createSeason ahora exige <code>total_matchdays</code> explícito</strong> (se acabó el default silencioso de 18). El Create sheet muestra un input dedicado que arranca vacío, con placeholder adaptativo según fase (<code>ej. 18</code> liga, <code>ej. 4</code> playoff). El capitán pone el número real." },
      { type: "feat", text: "<strong>Conflicto 'una temporada activa por equipo' ahora se traduce a copy humano</strong>. El unique index surfaceaba el error crudo de Postgres (<code>23505 duplicate key value violates...one_active_season_per_team</code>). Ahora se captura, se hace fetch de la temporada activa y se muestra: <em>'Ya hay una temporada activa. Tienes \"Liga 25/26\" en curso. ¿Cerrarla y crear \"Playoff 25/26\" como nueva temporada activa?'</em>. Confirmar cierra la anterior y reintenta el create." },
      { type: "feat", text: "<strong>Nuevo servicio <code>closeSeason(id)</code></strong>: marca <code>active=false</code> y <code>end_date=today</code>. <code>SeasonDetailScreen</code> añade botón <em>Cerrar temporada</em> al final cuando el usuario es capitán y la temporada está activa. Tras cerrar: se ocultan TODOS los affordances de edición (<em>Escanear</em>, <em>+</em>, lápiz por fila, <em>Crear nueva jornada</em> punteado), aparece eyebrow <em>HISTÓRICA</em> y una card-nota archived debajo de la lista. <code>JornadaScreen</code> sigue siendo read-only vía el guard existente <code>matchday.status='finished'</code> — cerrar temporada NO cascada-finaliza jornadas (es by design: el estado de temporada es independiente del acta por jornada). Esto desbloquea el flow del founder: <em>liga regular</em> primero, luego cerrarla y crear <em>playoff</em> como segunda temporada activa." },
      { type: "fix", text: "<strong>CreateSeasonSheet · spinner pegado</strong>. Cuando el Alert de conflicto se cancelaba, la rama 23505 dejaba <code>submitting=true</code> esperando que el callback del Alert lo desactivara, pero el botón Cancel del Alert no tiene callback — la flag nunca se limpiaba. Fix: liberar <code>submitting</code> ANTES de abrir el Alert; el confirm handler gestiona su propio ciclo. Extraído helper <code>performInsert</code> para que el flow normal y el conflict-retry compartan el mismo payload." },
      { type: "chore", text: "<strong>total_matchdays ahora es opcional</strong> end-to-end. Migración: <code>seasons.total_matchdays</code> pierde NOT NULL y default 18 (semantically null = <em>'aún no se sabe'</em>). <code>createSeason</code> acepta <code>number | null | undefined</code>. <code>CreateSeasonSheet</code> muestra <em>· OPCIONAL</em> y valida solo si está rellenado (1-99). <code>ActiveSeasonCard</code> y <code>HomeScreen</code> guardan con <code>!= null</code> antes de pintar el sufijo <code>· N jornadas</code>." },
      { type: "chore", text: "6 commits del día (<code>394d373f → 71953748</code>) ya en <code>origin/main</code>." },
    ],

      { type: "feat", text: "<strong>Cuentas sociales creadas</strong>: Instagram <code>@tactium.io</code> (Creator account — sin dirección fiscal, Original Sound en Reels libre) y TikTok <code>@tactium.io</code> (Business — desbloquea website link en bio sin esperar a 1k followers)." },

/* ─────────────────────────────────────────────────────────────────
   Render — no tocar a menos que cambies estilo/funcionalidad.
   ───────────────────────────────────────────────────────────────── */
const TYPE_LABELS = {
  feat: "FEAT",
  fix: "FIX",
  chore: "CHORE",
  docs: "DOCS",
  decision: "DECISIÓN",
};

const MONTHS_ES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return `${String(d).padStart(2,"0")} ${MONTHS_ES[m-1]} ${y}`;
}
function shortDate(iso) {
  const [, m, d] = iso.split("-").map(Number);
  return `${String(d).padStart(2,"0")} ${MONTHS_ES[m-1]}`;
}

let activeFilter = "all";

function render() {
  const sorted = [...LOG].sort((a, b) => (a.date < b.date ? 1 : -1));

  // Stats
  const totalChanges = LOG.reduce((acc, e) => acc + e.changes.length, 0);
  document.getElementById("stat-sessions").textContent = LOG.length;
  document.getElementById("stat-changes").textContent = totalChanges;
  document.getElementById("stat-last").textContent = sorted[0] ? shortDate(sorted[0].date) : "—";
  document.getElementById("stat-streak").textContent = new Set(LOG.map(e => e.date)).size;

  // Timeline
  const tl = document.getElementById("timeline");
  tl.innerHTML = "";

  let visibleCount = 0;
  for (const entry of sorted) {
    const filtered = activeFilter === "all"
      ? entry.changes
      : entry.changes.filter(c => c.type === activeFilter);
    if (!filtered.length) continue;
    visibleCount++;

    const el = document.createElement("article");
    el.className = "entry";
    el.innerHTML = `
      <div class="entry-head">
        <p class="entry-date">${formatDate(entry.date)}</p>
      </div>
      <h2 class="entry-title">${entry.title}</h2>
      <ul class="changes">
        ${filtered.map(c => `
          <li class="change">
            <span class="badge ${c.type}">${TYPE_LABELS[c.type] || c.type}</span>
            <div class="change-text">${c.text}</div>
          </li>
        `).join("")}
      </ul>
    `;
    tl.appendChild(el);
  }

  if (!visibleCount) {
    tl.innerHTML = `<p class="empty">No hay entradas para este filtro.</p>`;
  }
}

document.getElementById("filters").addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.type;
  render();
});

render();
</script>
