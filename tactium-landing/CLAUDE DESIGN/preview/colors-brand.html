<!doctype html><html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .sw{height:120px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);}
  .name{font-family:var(--font-sans);font-weight:700;font-size:13px;}
  .hex{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:rgba(232,245,239,0.55);margin-top:2px;}
</style></head><body>
  <div class="sw" style="background:#00DF82;color:#001810"><div class="name">Accent · TACTIUM</div><div class="hex" style="color:rgba(0,24,16,0.65)">#00DF82</div></div>
  <div class="sw" style="background:#00B86B;color:#001810"><div class="name">Accent dim</div><div class="hex" style="color:rgba(0,24,16,0.65)">#00B86B</div></div>
  <div class="sw" style="background:#03624C;color:#E8F5EF"><div class="name">Primary</div><div class="hex">#03624C</div></div>
  <div class="sw" style="background:#02463A;color:#E8F5EF"><div class="name">Primary dim</div><div class="hex">#02463A</div></div>
</body></html>
