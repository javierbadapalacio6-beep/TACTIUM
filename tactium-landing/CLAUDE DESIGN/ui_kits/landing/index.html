<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>TACTIUM · Landing UI kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    position: relative;
  }

  /* ─── Site-wide grid background ─── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(232,245,239,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,245,239,0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 0%, rgba(0,0,0,0.85) 60%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 0%, rgba(0,0,0,0.85) 60%, transparent 100%);
  }
  body > * { position: relative; z-index: 1; }

  /* ─── Phone idle float ─── */
  @keyframes tk-float {
    0%, 100% { translate: 0 -10px; }
    50%      { translate: 0  10px; }
  }
  .tk-phone {
    animation: tk-float 7.5s ease-in-out infinite alternate;
    will-change: translate;
  }

  /* ─── Scroll-triggered reveal ─── */
  [data-tk-reveal] {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 800ms cubic-bezier(0.25,1,0.5,1),
                transform 800ms cubic-bezier(0.25,1,0.5,1);
    transition-delay: var(--tk-delay, 0ms);
  }
  [data-tk-reveal].tk-in {
    opacity: 1;
    transform: none;
  }

  /* ─── Bento + pricing hover lift ─── */
  .bento > div, .pricing-grid > div {
    transition: transform 280ms cubic-bezier(0.25,1,0.5,1),
                box-shadow  280ms cubic-bezier(0.25,1,0.5,1);
  }
  .bento > div:hover {
    transform: translateY(-6px);
    box-shadow: inset 0 0 0 1px var(--color-accent-40),
                0 28px 60px -20px rgba(0,223,130,0.18) !important;
  }
  .pricing-grid > div:hover {
    transform: translateY(-6px);
  }

  /* ─── Reduced-motion respect ─── */
  @media (prefers-reduced-motion: reduce) {
    .tk-phone { animation: none !important; }
    [data-tk-reveal] { opacity: 1 !important; transform: none !important; }
  }

  /* ─── ≤ 920px: collapse multi-column sections ─── */
  @media (max-width: 920px) {
    .hero-grid, .two-col { grid-template-columns: 1fr !important; gap: 32px !important; }
    .three-col { grid-template-columns: 1fr !important; gap: 48px !important; }
    .bento { grid-template-columns: 1fr 1fr !important; }
    .pricing-grid { grid-template-columns: 1fr 1fr !important; }
    .hero-phones { height: 460px !important; }
    .step-phone { height: 380px !important; }
    .club-phones { height: 520px !important; }
  }

  /* ─── ≤ 720px: phone scale-down, hide site nav ─── */
  @media (max-width: 720px) {
    .site-nav-link { display: none !important; }
    .bento { grid-template-columns: 1fr !important; }
    .bento > div { grid-column: span 1 !important; }
    .hero-phones { height: 420px !important; transform: scale(0.85); transform-origin: center top; }
    .step-phone { height: 360px !important; }
    .club-phones { height: 480px !important; transform: scale(0.85); transform-origin: center top; }
  }

  /* ─── ≤ 560px: tighten pricing & hero phones ─── */
  @media (max-width: 560px) {
    .pricing-grid { grid-template-columns: 1fr !important; }
    .hero-phones { height: 380px !important; transform: scale(0.72); }
    .club-phones { height: 420px !important; transform: scale(0.72); }
    .step-phone { height: 320px !important; }
  }
  /* ─── demo iPhone scale on small viewports ─── */
  @media (max-width: 720px) {
    .demo-device { transform: scale(0.78); transform-origin: center top; }
    .demo-stage { margin-top: 24px !important; height: 680px; }
  }
  @media (max-width: 480px) {
    .demo-device { transform: scale(0.62); transform-origin: center top; }
    .demo-stage { height: 560px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../app/ios-frame.jsx"></script>
  <script type="text/babel" src="../app/components.jsx"></script>
  <script type="text/babel" src="../app/screens.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>

  <script type="text/babel">
    function Landing() {
      return (
        <>
          <Header/>
          <main>
            <Hero/>
            <FederationsMarquee/>
            <AppPreview/>
            <ForWho/>
            <ForClubs/>
            <Features/>
            <Pricing/>
            <FAQ/>
            <FinalCta/>
          </main>
          <Footer/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Landing/>);

    // ─── Scroll-triggered section reveals ─────────────────────
    requestAnimationFrame(() => {
      const sections = document.querySelectorAll("main > section");
      sections.forEach((s, i) => { if (i > 0) s.setAttribute("data-tk-reveal", ""); });
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add("tk-in"); io.unobserve(e.target); }
        });
      }, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });
      document.querySelectorAll("[data-tk-reveal]").forEach(el => io.observe(el));
    });
  </script>
</body>
</html>
