<!doctype html><html><head><meta charset="utf-8"><title>Accent tints</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--color-bg);display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .sw{height:120px;border-radius:14px;background:var(--color-bg-card);padding:14px;display:flex;flex-direction:column;justify-content:space-between;}
  .chip{height:50px;border-radius:8px;}
  .label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
  .num{font-family:var(--font-mono);font-size:11px;color:var(--color-accent);}
</style></head><body>
  <div class="sw"><div class="chip" style="background:rgba(0,223,130,0.10)"></div><div><div class="num">10</div><div class="label">accent / 10</div></div></div>
  <div class="sw"><div class="chip" style="background:rgba(0,223,130,0.15)"></div><div><div class="num">15</div><div class="label">accent / 15</div></div></div>
  <div class="sw"><div class="chip" style="background:rgba(0,223,130,0.25)"></div><div><div class="num">25</div><div class="label">accent / 25</div></div></div>
  <div class="sw"><div class="chip" style="background:rgba(0,223,130,0.40)"></div><div><div class="num">40</div><div class="label">accent / 40</div></div></div>
  <div class="sw"><div class="chip" style="background:rgba(0,223,130,0.55)"></div><div><div class="num">55</div><div class="label">accent / 55</div></div></div>
</body></html>
