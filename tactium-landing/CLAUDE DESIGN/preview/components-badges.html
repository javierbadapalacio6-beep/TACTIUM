<!doctype html><html><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.lbl{width:100%;font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
.b{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;padding:6px 10px;border-radius:8px;}
.dot{width:6px;height:6px;border-radius:999px;}
.result{font-family:var(--font-sans);font-weight:700;font-size:14px;letter-spacing:0;text-transform:none;padding:0;border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;}
</style></head><body>
  <div class="lbl">Status badges · derived from app screens</div>
  <span class="b" style="color:var(--color-accent);background:var(--color-accent-10);box-shadow:inset 0 0 0 1px var(--color-accent-40);"><span class="dot" style="background:var(--color-accent)"></span>VALIDADA</span>
  <span class="b" style="color:#F2C94C;background:rgba(242,201,76,0.10);box-shadow:inset 0 0 0 1px rgba(242,201,76,0.40);"><span class="dot" style="background:#F2C94C"></span>PENDIENTE</span>
  <span class="b" style="color:var(--color-accent);background:transparent;box-shadow:inset 0 0 0 1px var(--color-accent-40);"><span class="dot" style="background:var(--color-accent)"></span>LOCAL</span>
  <span class="b" style="color:var(--color-text-faint);box-shadow:inset 0 0 0 1px var(--color-hair-strong);">○ VISITANTE</span>
  <span class="b" style="color:var(--color-accent);background:var(--color-accent-15);box-shadow:inset 0 0 0 1px var(--color-accent-55);">TOP</span>
  <span class="result" style="color:var(--color-accent);background:var(--color-accent-10);box-shadow:inset 0 0 0 1px var(--color-accent-40);">V</span>
  <span class="result" style="color:var(--color-error);background:rgba(255,107,107,0.10);box-shadow:inset 0 0 0 1px rgba(255,107,107,0.40);">D</span>
  <span class="result" style="color:#F2C94C;background:rgba(242,201,76,0.10);box-shadow:inset 0 0 0 1px rgba(242,201,76,0.40);">E</span>
</body></html>
