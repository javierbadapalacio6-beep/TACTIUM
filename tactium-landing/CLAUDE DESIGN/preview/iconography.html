<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:flex;flex-direction:column;gap:14px;}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;}
.cell{background:var(--color-bg-card);border-radius:12px;height:60px;display:grid;place-items:center;box-shadow:var(--shadow-inset-line);}
.icon{width:22px;height:22px;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.muted{stroke:var(--color-text-muted);}
.accent{stroke:var(--color-accent);}
.name{font-family:var(--font-mono);font-size:9px;color:var(--color-text-faint);letter-spacing:0.1em;text-align:center;margin-top:4px;}
.col{display:flex;flex-direction:column;align-items:center;}
</style></head><body>
  <div class="lbl">Lucide · stroke 1.75 · accent for active, muted for chrome</div>
  <div class="grid">
    <div class="col"><div class="cell"><svg class="icon accent" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><div class="name">zap</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><div class="name">calendar</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div><div class="name">map-pin</div></div>
    <div class="col"><div class="cell"><svg class="icon accent" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div><div class="name">users</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></div><div class="name">chevron-l</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div><div class="name">chevron-r</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div><div class="name">trash-2</div></div>
    <div class="col"><div class="cell"><svg class="icon accent" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></div><div class="name">pencil</div></div>
    <div class="col"><div class="cell"><svg class="icon accent" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div><div class="name">check</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div><div class="name">arrow-r</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></div><div class="name">more-h</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></div><div class="name">grid</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><path d="M12 20V10M18 20V4M6 20v-6"/></svg></div><div class="name">bar-chart</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg></div><div class="name">share</div></div>
    <div class="col"><div class="cell"><svg class="icon muted" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><line x1="2" y1="2" x2="22" y2="22"/></svg></div><div class="name">bell-off</div></div>
    <div class="col"><div class="cell"><svg class="icon accent" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 16 0v1"/></svg></div><div class="name">user</div></div>
  </div>
</body></html>
