<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
.label{width:100%;font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style></head><body>
  <div class="label">Buttons · primary, ghost, icon-led, disabled</div>
  <button class="btn-accent">Confirmar alineación
    <svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
  </button>
  <button class="btn-ghost">Ver alineación</button>
  <button class="btn-accent" style="padding:14px 20px">
    <svg class="icon" viewBox="0 0 24 24" style="color:var(--color-text-inverse)"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Crear alineación
  </button>
  <button class="btn-ghost" disabled style="opacity:0.4;cursor:not-allowed">No estoy en la plantilla</button>
</body></html>
