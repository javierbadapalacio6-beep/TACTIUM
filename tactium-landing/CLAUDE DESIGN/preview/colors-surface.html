<!doctype html><html><head><meta charset="utf-8"><title>Surface colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;color:var(--color-text);}
  .sw{height:120px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);}
  .name{font-family:var(--font-sans);font-weight:700;font-size:13px;}
  .hex{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--color-text-faint);margin-top:2px;}
</style></head><body>
  <div class="sw" style="background:#030F0F"><div class="name">Bg base</div><div class="hex">#030F0F</div></div>
  <div class="sw" style="background:#081818"><div class="name">Bg raised</div><div class="hex">#081818</div></div>
  <div class="sw" style="background:#0C2222"><div class="name">Bg card</div><div class="hex">#0C2222</div></div>
  <div class="sw" style="background:#0F2A28"><div class="name">Bg card · hover</div><div class="hex">#0F2A28</div></div>
</body></html>
