<!doctype html><html><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--color-bg);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .sw{height:120px;border-radius:14px;background:var(--color-bg-card);padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-inset-line);}
  .row{display:flex;align-items:center;gap:10px;}
  .dot{width:36px;height:36px;border-radius:10px;}
  .name{font-family:var(--font-sans);font-weight:700;font-size:14px;color:var(--color-text);}
  .hex{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.2em;padding:6px 10px;border-radius:8px;}
</style></head><body>
  <div class="sw">
    <div class="row"><div class="dot" style="background:#00DF82"></div><div><div class="name">Success</div><div class="hex">#00DF82</div></div></div>
    <div><span class="pill" style="color:#00DF82;background:rgba(0,223,130,0.10);box-shadow:inset 0 0 0 1px rgba(0,223,130,0.40);">VALIDADA</span></div>
  </div>
  <div class="sw">
    <div class="row"><div class="dot" style="background:#F2C94C"></div><div><div class="name">Warning</div><div class="hex">#F2C94C</div></div></div>
    <div><span class="pill" style="color:#F2C94C;background:rgba(242,201,76,0.10);box-shadow:inset 0 0 0 1px rgba(242,201,76,0.40);">PENDIENTE</span></div>
  </div>
  <div class="sw">
    <div class="row"><div class="dot" style="background:#FF6B6B"></div><div><div class="name">Error</div><div class="hex">#FF6B6B</div></div></div>
    <div><span class="pill" style="color:#FF6B6B;background:rgba(255,107,107,0.10);box-shadow:inset 0 0 0 1px rgba(255,107,107,0.40);">DERROTA</span></div>
  </div>
</body></html>
