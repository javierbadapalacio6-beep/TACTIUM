<!doctype html><html><head><meta charset="utf-8"><title>Type · Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.card{background:var(--color-bg-card);border-radius:14px;padding:18px;box-shadow:var(--shadow-inset-line);}
.eye{font-family:var(--font-mono);font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:var(--color-accent);margin-bottom:8px;}
.eye-mute{color:var(--color-text-faint);}
.row{display:flex;align-items:baseline;gap:8px;margin-top:8px;}
.num{font-family:var(--font-mono);font-weight:700;font-size:32px;color:var(--color-accent);font-variant-numeric:tabular-nums;}
.unit{font-family:var(--font-mono);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-text-faint);}
.tabular{font-family:var(--font-mono);font-size:13px;color:var(--color-text-muted);letter-spacing:0.1em;}
</style></head><body>
  <div class="card">
    <div class="eye">JORNADA · J·01 · ALINEACIÓN</div>
    <div class="row"><span class="num">4600</span><span class="unit">PTS</span></div>
    <div class="tabular">Drive · 2400 · 2200</div>
  </div>
  <div class="card">
    <div class="eye eye-mute">PRECIOS · MONO TABULAR</div>
    <div class="row"><span class="num">4,99</span><span class="unit">€ / mes</span></div>
    <div class="tabular">14 días · gratis · cancela</div>
  </div>
</body></html>
