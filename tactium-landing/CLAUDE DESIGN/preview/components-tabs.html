<!doctype html><html><head><meta charset="utf-8"><title>Tabs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:flex;flex-direction:column;gap:16px;}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
.bar{display:flex;background:var(--color-bg-card);border-radius:24px;padding:8px;gap:4px;box-shadow:var(--shadow-inset-line);justify-content:space-around;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;border-radius:18px;font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--color-text-muted);cursor:pointer;}
.tab.active{color:var(--color-text);background:rgba(255,255,255,0.04);}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.seg{display:inline-flex;background:rgba(232,245,239,0.04);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--color-hair-strong);}
.seg button{background:transparent;border:0;font-family:var(--font-mono);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-text-faint);padding:8px 14px;border-radius:999px;cursor:pointer;}
.seg button.on{background:var(--color-accent-10);color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent-40);}
</style></head><body>
  <div class="lbl">Bottom tab bar · capitán</div>
  <div class="bar">
    <div class="tab active"><svg class="icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Inicio</div>
    <div class="tab"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Temporadas</div>
    <div class="tab"><svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="17" cy="7" r="3"/></svg>Equipo</div>
    <div class="tab"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 16 0v1"/></svg>Perfil</div>
  </div>
  <div class="lbl">Segmented control · pricing toggle</div>
  <div class="seg">
    <button class="on">MENSUAL</button>
    <button>ANUAL · −20%</button>
  </div>
</body></html>
