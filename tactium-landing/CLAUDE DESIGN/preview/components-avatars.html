<!doctype html><html><head><meta charset="utf-8"><title>Avatars</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:flex;flex-direction:column;gap:14px;}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
.row{display:flex;gap:12px;align-items:center;}
.av{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-sans);font-weight:700;font-size:14px;}
.av.accent{background:rgba(0,223,130,0.10);color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent-25);}
.av.mute{background:rgba(232,245,239,0.04);color:var(--color-text-muted);box-shadow:inset 0 0 0 1px var(--color-hair-strong);}
.av.lg{width:64px;height:64px;border-radius:14px;font-size:18px;}
.tile-logo{background:var(--color-primary);color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent-40);font-weight:800;}
.circle{border-radius:999px;}
</style></head><body>
  <div class="lbl">Player initials · brand tile · circle</div>
  <div class="row">
    <div class="av accent">JU</div>
    <div class="av accent">PE</div>
    <div class="av accent">DA</div>
    <div class="av mute">SÁ</div>
    <div class="av mute">MA</div>
    <div class="av lg tile-logo">T</div>
    <div class="av accent circle">CA</div>
  </div>
</body></html>
