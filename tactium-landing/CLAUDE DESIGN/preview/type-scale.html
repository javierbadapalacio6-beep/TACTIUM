<!doctype html><html><head><meta charset="utf-8"><title>Type · Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--color-bg);display:flex;flex-direction:column;gap:12px;}
.row{display:grid;grid-template-columns:80px 1fr 200px;align-items:baseline;gap:18px;}
.label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-text-faint);}
.spec{font-family:var(--font-mono);font-size:10px;letter-spacing:0.10em;color:var(--color-text-faint);text-align:right;}
.sample{font-family:var(--font-sans);color:var(--color-text);}
</style></head><body>
  <div class="row"><div class="label">H1</div><div class="sample" style="font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-0.02em;">vs. Fort Padel</div><div class="spec">800 · 40px</div></div>
  <div class="row"><div class="label">H2</div><div class="sample" style="font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-0.02em;">3/3 parejas</div><div class="spec">800 · 30px</div></div>
  <div class="row"><div class="label">H3</div><div class="sample" style="font-weight:700;font-size:18px;">Disponibilidad</div><div class="spec">700 · 18px</div></div>
  <div class="row"><div class="label">Body</div><div class="sample" style="font-weight:400;font-size:15px;color:var(--color-text-muted);">Las parejas se ordenan por puntos automáticamente.</div><div class="spec">400 · 15px · 70%</div></div>
  <div class="row"><div class="label">Small</div><div class="sample" style="font-weight:400;font-size:13px;color:var(--color-text-faint);">0% del equipo confirmado</div><div class="spec">400 · 13px · 50%</div></div>
</body></html>
