<!doctype html><html><head><meta charset="utf-8"><title>Brand Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; height:140px; display:grid; grid-template-columns: 1fr 1fr; align-items:center; padding: 0 28px; gap:24px; }
  .a { display:flex; align-items:center; gap:14px; }
  .tile { width:56px; height:56px; border-radius:14px; background:var(--color-primary); display:grid; place-items:center; font-family:var(--font-sans); font-weight:800; font-size:32px; color:var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent-25); }
  .word { font-family:var(--font-sans); font-weight:800; font-size:26px; letter-spacing:0.02em; }
  .logo-img { width:96px; height:96px; border-radius:18px; object-fit:cover; }
  .label { color:var(--color-text-faint); font-family:var(--font-mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; margin-top:8px; }
</style></head>
<body>
  <div>
    <img class="logo-img" src="../assets/logo.png" alt="TACTIUM logo">
    <div class="label">App icon · raster</div>
  </div>
  <div>
    <div class="a"><div class="tile">T</div><div class="word">TACTIUM</div></div>
    <div class="label">Inline lockup · 56px tile + word</div>
  </div>
</body></html>
